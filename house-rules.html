  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

bel }}<\u002Fspan>\n              <\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"font-size: 12px; color: #6a6a6a; white-space: nowrap; display: none;\" data-desktop-only=\"1\">Updated Aug. 2026<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <sc-if value=\"{{ mobileNavOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ onMobileBackdropClick }}\" style=\"position: fixed; inset: 0; z-index: 25; background: rgba(30,28,20,0.35);\">\n      <nav class=\"hr-nav\" sc-camel-on-click=\"{{ onNavClick }}\" style=\"background: #f5f2e0; width: 260px; max-width: 82vw; height: 100%; padding: 20px 20px 40px; overflow-y: auto; box-shadow: 4px 0 16px rgba(0,0,0,0.15);\">\n        <div style=\"font-family: 'Jost', sans-serif; letter-spacing: 0.2em; text-transform: uppercase; font-size: 11px; color: var(--bronze-dark); padding-left: 12px; margin-bottom: 6px;\">Contents<\u002Fdiv>\n        <a href=\"#intro\" style=\"{{ navStyles.intro }}\">Incorporation By Reference<\u002Fa>\n        <a href=\"#general-policies\" style=\"{{ navStyles.generalPolicies }}\">General Policies<\u002Fa>\n        <a href=\"#moving\" style=\"{{ navStyles.moving }}\">Moving &amp; Large Item Handling<\u002Fa>\n        <a href=\"#common-areas\" style=\"{{ navStyles.commonAreas }}\">Common Areas<\u002Fa>\n        <a href=\"#storage\" style=\"{{ navStyles.storage }}\">Storage, Bicycles &amp; eBikes<\u002Fa>\n        <a href=\"#insurance\" style=\"{{ navStyles.insurance }}\">Insurance Requirements<\u002Fa>\n        <a href=\"#access\" style=\"{{ navStyles.access }}\">Apartment Access<\u002Fa>\n        <a href=\"#keys\" style=\"{{ navStyles.keys }}\">Apartment Keys<\u002Fa>\n        <a href=\"#subletting\" style=\"{{ navStyles.subletting }}\">Subletting<\u002Fa>\n        <a href=\"#work\" style=\"{{ navStyles.work }}\">Work Inside Apartments<\u002Fa>\n        <a href=\"#safety\" style=\"{{ navStyles.safety }}\"> href=\"#ky-bars\" style=\"font-size: 12.5px; padding: 3px 0; color: #5c5c5c; border-left: none; padding-left: 0;\">Interior Bars<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <a href=\"#subletting\" style=\"{{ navStyles.subletting }}\">Subletting<\u002Fa>\n        <sc-if value=\"{{ subOpen.subletting }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; flex-direction: column; padding: 2px 0 6px 20px;\">\n            <a href=\"#sl-policies\" style=\"font-size: 12.5px; padding: 3px 0; color: #5c5c5c; border-left: none; padding-left: 0;\">Subletting Policies<\u002Fa>\n            <a href=\"#sl-fees\" style=\"font-size: 12.5px; padding: 3px 0; color: #5c5c5c; border-left: none; padding-left: 0;\">Sublet Fees<\u002Fa>\n            <a href=\"#sl-violations\" style=\"font-size: 12.5px; padding: 3px 0; color: #5c5c5c; border-left: none; padding-left: 0;\">Violations<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <a href=\"#work\" style=\"{{ navStyles.work }}\">Work Inside Apartments<\u002Fa>\n        <sc-if value=\"{{ subOpen.work }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; flex-direction: column; padding: 2px 0 6px 20px;\">\n            <a href=\"#wk-workdays\" style=\"font-size: 12.5px; padding: 3px 0; color: #5c5c5c; border-left: none; padding-left: 0;\">Workdays<\u002Fa>\n            <a href=\"#wk-diy\" style=\"font-size: 12.5px; padding: 3px 0; color: #5c5c5c; border-left: none; padding-left: 0;\">Limits on DIY<\u002Fa>\n            <a href=\"#wk-duration\" style=\"font-size: 12.5px; padding: 3px 0; color: #5c5c5c; border-left: none; padding-left: 0;\">Renovation Duration<\u002Fa>\n            <a href=\"#wk-coi\" style=\"font-size: 12.5px; padding: 3px 0; color: #5c5c5c; border-left: none; padding-left: 0;\">COI Requirements<\u002Fa>\n            <a href=\"#wk-riser\" style=\"font-size: 12.5px; padding: 3px 0; color: #5c5c5c; border-left: none; padding-left: 0;\">Riser Replacement<\u002Fa>\n            <a href=\"#wk-repair\" style=\"font-size: 12.5px; padding: 3px 0; color: #5c5c5c; border-left: none; padding-left: 0;\">State of Good Repair<\u002Fa>\n            <a href=\"#wk-enter\" style=\"font-size: 12.5px; padding: 3px 0; color: #5c5c5c; border-left: none; padding-left: 0;\">Right to Enter<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <a href=\"#safety\" style=\"{{ navStyles.safety }}\">Safety<\u002Fa>\n        <sc-if value=\"{{ subOpen.safety }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; flex-direction: column; padding: 2px 0 6px 20px;\">\n            <a href=\"#sf-flammable\" style=\"font-size: 12.5px; padding: 3px 0; color: #5c5c5c; border-left: none; padding-left: 0;\">Flammable Material<\u002Fa>\n            <a href=\"#sf-elevators\" style=\"font-size: 12.5px; padding: 3px 0; color: #5c5c5c; border-left: none; padding-left: 0;\">Elevators<\u002Fa>\n            <a href=\"#sf-staff\" style=\"font-size: 12.5px; padding: 3px 0; color: #5c5c5c; border-left: none; padding-left: 0;\">Work by Staff<\u002Fa>\n            <a href=\"#sf-fire\" style=\"font-size: 12.5px; padding: 3px 0; color: #5c5c5c; border-left: none; padding-left: 0;\">Fire Notices<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <a href=\"#compliance\" style=\"{{ navStyles.compliance }}\">Consequences of Non-Compliance<\u002Fa>\n      <\u002Fnav>\n    <\u002Faside>\n\n    <!-- MAIN CONTENT -->\n    <main style=\"flex: 1; min-width: 0; padding: 36px 0 100px;\">\n\n      <div style=\"font-family: 'Jost', sans-serif; letter-spacing: 0.3em; text-transform: uppercase; font-size: 12px; color: var(--bronze-dark);\">House Rules<\u002Fdiv>\n      <h1 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 36px; margin: 8px 0 4px; border-bottom: 3px double var(--bronze); padding-bottom: 18px;\">433 West 34th Street House Rules<\u002Fh1>\n      <p style=\"color: #5c5c5c; margin-top: 16px;\">Updated: August 2026<\u002Fp>\n\n      <!-- INTRO -->\n      <section id=\"intro\" class=\"hr-block\" data-block=\"1\" data-search-text=\"incorporation by reference from time to time the building may issue specific policies any such policies are incorporated by reference into these house rules these house rules are supplementary to those described in the proprietary lease which notes in paragraph 13 all shareholders are responsible for complying with the provisions of both documents whether or not each policy is described in both places\" style=\"margin-top: 40px; border-top: 3px double var(--bronze); border-bottom: 3px double var(--bronze); background: #ece5cd; padding: 22px 26px;\">\n        <div style=\"font-family: 'Jost', sans-serif; letter-spacing: 0.22em; text-transform: uppercase; font-size: 11px; color: var(--bronze-dark); margin-bottom: 6px;\">Before the Rules<\u002Fdiv>\n        <h2 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 20px; margin: 0 0 12px;\">Incorporation By Reference<\u002Fh2>\n        <p>From time to time, the Building may issue specific policies. Any such policies are incorporated by reference into these House Rules.<\u002Fp>\n        <p style=\"margin-bottom: 0;\">These House Rules are supplementary to those described in the Proprietary Lease which notes in ¶13 \"This Lease shall be in all respects subject to such House Rules which, when a copy thereof has been furnished to the Lessee, shall be taken to be part hereof…\". All Shareholders are responsible for complying with the provisions of both documents, whether or not each policy is described in both places.<\u002Fp>\n      <\u002Fsection>\n\n      <!-- GENERAL POLICIES -->\n      <section id=\"general-policies\" style=\"margin-top: 48px;\">\n        <div style=\"font-family: 'Jost', sans-serif; letter-spacing: 0.3em; text-transform: uppercase; font-size: 12px; color: var(--bronze-dark); margin-bottom: 6px;\">Section<\u002Fdiv>\n        <h2 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 30px; margin: 0 0 8px; border-bottom: 3px double var(--bronze); padding-bottom: 14px;\">General Policies<\u002Fh2>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"non-smoking smoking is prohibited in all common areas of the building hallways stairwells terraces balconies vaping cannabis 20 feet of the entrances\">\n          <h3 id=\"gp-smoking\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">Non-Smoking<\u002Fh3>\n          <p>Smoking is prohibited in all common areas of the Building such as (but not limited to) the hallways and stairwells, as well as in the limited access common areas such as terraces and balconies. The term \"smoking\" includes use or handling of any lit, smoldering, or electronic product containing tobacco, cloves, or similar substances, and marijuana or other cannabis products in any form (e.g., cigarettes, e-cigarettes, vaping devices, cigars, pipes, etc.).<\u002Fp>\n          <p>Smoking is also prohibited outside of the Building within 20 feet of the entrances.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"unreasonable noise no building occupant may make or permit noise that unreasonably disturbs other occupants 10 pm 8 am rugs carpeting padding 80 percent floor area kitchens pantries bathrooms hallways closets foyers\">\n          <h3 id=\"gp-noise\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">Unreasonable Noise<\u002Fh3>\n          <p>No building occupant may make or permit noise that unreasonably disturbs other occupants at any time. In addition, no occupant may have loud parties or play TVs, sound systems, or musical instruments in such a manner as may disturb other occupants between the hours of 10:00 pm and 8:00 am.<\u002Fp>\n          <p>The floors of each apartment must be covered with rugs or carpeting with effective noise-reducing padding/material, to the extent of at least 80% of the floor area of each room excepting only kitchens, pantries, bathrooms, hallways, closets, and foyers.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"windows apartment windows belong to the building not to each unit cannot be altered without approval management board resident shall keep windows clean 10 days notice window guards catwalks second 19th floors planters chairs thrown animals fed screens weather secured professionally installed\">\n          <h3 id=\"gp-windows\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">Windows<\u002Fh3>\n          <p>Apartment windows belong to the Building, not to each unit. They cannot be altered without the approval of the Management company and the Board.<\u002Fp>\n          <p>The resident shall keep the windows of the apartment clean. In case of refusal or neglect of the resident during ten (10) days after notice in writing from the building or the managing agent to clean the windows, such cleaning may be done by the Co-Op, which shall have the right, to enter and to charge the cost of the cleaning to the Shareholder.<\u002Fp>\n          <p>Pursuant to New York City local law, all residents with children less than 10 years of age should contact Management concerning the installation of window guards.<\u002Fp>\n          <p>No objects shall be placed on outside window sills. Catwalks located outside of apartment windows on the second and 19th floors shall not be used for apartment access. Objects such as planters or chairs cannot be placed in these areas.<\u002Fp>\n          <p>Nothing may be thrown from the windows at any time, and no birds or animals may be fed from any of the windows.<\u002Fp>\n          <p>Any window screens must be weather secured and professionally installed.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"air conditioners installation removal must be performed by licensed contractors insurance policies on file with management brackets window bars lower windows\">\n          <h3 id=\"gp-ac\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">Air Conditioners<\u002Fh3>\n          <p>Air conditioner installation and removal must be performed by licensed contractors who have insurance policies on file with Management. Please contact Management for a list of approved contractors.<\u002Fp>\n          <p>Air conditioners must be supported by brackets and window bars, and may only be installed in lower windows.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"garbage disposal composting recycling policies compactor chutes stairwell health hazard nyc health department pest problems garbage bags tied drip-free broken glass blades needles wrapped packaged food scraps organic waste composted building compost bin local law 85 recyclables separated paper metal glass rigid plastic west stairwell freight elevator cardboard boxes broken down folded furniture large refuse basement freight elevator doorman porter superintendent clothing donations housing works ecycling locker confidential paper recycling\">\n          <h3 id=\"gp-garbage\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">Garbage Disposal, Composting and Recycling Policies<\u002Fh3>\n          <ul style=\"padding-left: 20px;\">\n            <li>Non-recyclable, non-compostable garbage must be put into the compactor chutes in either stairwell. Placing garbage in the common areas of the building is a health hazard, violates NYC Health Department regulations, and contributes to pest problems.<\u002Fli>\n            <li>All garbage bags should be completely tied and drip-free before they leave the apartment. Proper disposal will aid in keeping the compactor room clean, avoiding injuries to our staff, and reducing pest problems. Broken glass, blades or exposed needles may not be placed loosely in a bag; they must be securely wrapped and packaged to avoid injury to the building staff.<\u002Fli>\n            <li>Food scraps and organic waste must be composted and must be brought to a building compost bin for disposal, as required by NYC Local Law 85. Compostable waste may not be disposed of in the regular garbage chute.<\u002Fli>\n            <li>Recyclables must be separated by type (eg paper, metal/glass/rigid plastic) and placed in the appropriate bins in the west stairwell near the freight elevator. <strong>Only recyclable items may be left in the bins.<\u002Fstrong><\u002Fli>\n            <li>Large cardboard boxes (e.g., from online purchases) should be broken down/folded and placed in the west stairwell near the freight elevator, and cannot obstruct the fire exit or stair access.<\u002Fli>\n            <li>Furniture and other large refuse must be brought to the basement level of the Building on the freight elevator. Please ask the doorman, porter, or Superintendent for elevator assistance.<\u002Fli>\n            <li>Clothing donations should be bagged and placed in the Housing Works bin in the basement; eCycling should be placed in the eCycling locker in the basement. Confidential paper recycling is available in a basement bin.<\u002Fli>\n          <\u002Ful>\n          <div style=\"border-top: 3px double var(--bronze); border-bottom: 3px double var(--bronze); background: var(--bronze-tint); padding: 16px 20px; margin-top: 20px;\">\n            <strong style=\"font-family: 'Jost', sans-serif; font-size: 15px; display: block; margin-bottom: 8px;\">Fines<\u002Fstrong>\n            <p style=\"margin: 0 0 8px;\">Violators of the recycling, garbage and composting rules, or residents found to be placing garbage in the stairwells or hallways, may be subject to charges for the staff cost of extra work associated with sanitizing and cleanup.<\u002Fp>\n            <p style=\"margin: 0;\">Management may, at the sole discretion of the Board, pass through to the offending Shareholder or Subtenant any fine payable by the Building due to noncompliance with applicable recycling laws or House Rules.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"repairs all repair requests must be entered through buildinglink for easy tracking paragraph 18a proprietary lease shareholders responsible cosmetic upkeep lights doors paint plaster hinges cabinet doors window hangings faucets taps interior walls exposed plumbing interior electrical appliances maintenance team building systems behind the wall plumbing heat water flow gas building electrical repairs\">\n          <h3 id=\"gp-repairs\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">Repairs<\u002Fh3>\n          <p>All repair requests must be entered through BuildingLink for easy tracking.<\u002Fp>\n          <p>Per ¶18(a) of the Proprietary Lease, Shareholders are responsible for the cosmetic upkeep of their units as well as repair of lights, doors, paint, plaster, hinges, cabinet doors, window hangings, faucets and taps, interior walls, exposed plumbing, interior electrical and appliances within their units. The maintenance team is here to work solely on issues that touch the building systems, such as behind-the-wall plumbing, heat, water flow, gas and building electrical repairs.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"packages deliveries doormen will sign for deliveries unless instructed otherwise no liability for deliveries not signed for by the recipient food groceries flowers alcohol courier no coi certificate of insurance furniture assembly large items corporate entities package room freight elevator moving large item handling section\">\n          <h3 id=\"gp-packages\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">Packages &amp; Deliveries<\u002Fh3>\n          <p>Doormen will sign for deliveries unless instructed otherwise. The Building and the doormen have no liability for deliveries not signed for by the recipient.<\u002Fp>\n          <p>Deliveries of food, groceries and other handheld items (e.g., flowers or alcohol) brought by courier to the apartment door do not require a COI.<\u002Fp>\n          <p>A Certificate of Insurance (COI) must be submitted to and approved by Management for furniture deliveries/assembly or other large items brought by corporate entities to an apartment before access will be allowed. These items may not be left in the package room. For freight elevator and coordination requirements applicable to large item deliveries, see the Moving &amp; Large Item Handling section.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"pest control co-op provides ongoing extermination service sign-up sheet doorman exterminator contractor on the premises management reason to believe apartment has a pest issue schedule extermination service sole discretion refused shareholder resident interior work sealing access points charged back shareholder duty maintain state of good repair\">\n          <h3 id=\"gp-pest\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">Pest Control<\u002Fh3>\n          <p>The Co-Op provides ongoing extermination service. A sign-up sheet is available from the doorman for Building occupants who wish to schedule appointments when the Building exterminator contractor is on the premises.<\u002Fp>\n          <p>If Management has reason to believe an apartment has a pest issue, it may schedule extermination service at its sole discretion and this service may not be refused by the shareholder or resident. Any interior work required to eliminate pest access, such as the sealing of access points, will be charged back to the Shareholder as part of each Shareholder's duty to maintain a state of good repair.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"contact information all residents required to maintain contact information buildinglink phone number email emergency contact photo front desk offsite shareholders mailing address management\">\n          <h3 id=\"gp-contact\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">Contact Information<\u002Fh3>\n          <p>All residents are required to maintain their contact information in the Building's selected System of Record (BuildingLink), including their phone number, email, emergency contact information, and a photo for front desk reference. Offsite shareholders must also provide a mailing address to Management.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- MOVING & LARGE ITEM HANDLING -->\n      <section id=\"moving\" style=\"margin-top: 48px;\">\n        <div style=\"font-family: 'Jost', sans-serif; letter-spacing: 0.3em; text-transform: uppercase; font-size: 12px; color: var(--bronze-dark); margin-bottom: 6px;\">Section<\u002Fdiv>\n        <h2 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 30px; margin: 0 0 8px; border-bottom: 3px double var(--bronze); padding-bottom: 14px;\">Moving &amp; Large Item Handling<\u002Fh2>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"requirements move-ins move-outs delivery removal furniture appliances large items coordinated in advance superintendent management indemnity agreement minimal belongings access list departing residents removed shareholders responsible subtenants family members co-tenants follow requirement\">\n          <h3 id=\"mv-requirements\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">Requirements<\u002Fh3>\n          <p>Move-ins, move-outs, and the delivery or removal of furniture, appliances, or other large items must be coordinated in advance with the Superintendent and Management, which may require an indemnity or other agreement. Even if a shareholder or sublettor is moving with minimal belongings, this ensures that only those allowed into the building are given access and that departing residents are removed from the access list.<\u002Fp>\n          <p>Shareholders are responsible for ensuring subtenants, family members and co-tenants follow this requirement.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"penalties shareholders may be assessed a fine for failing to inform management in advance move-in move-out large item delivery removal subtenants co-residents\">\n          <h3 id=\"mv-penalties\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">Penalties<\u002Fh3>\n          <p>Shareholders may be assessed a fine for failing to inform Management in advance of any move-in, move-out, or large item delivery or removal, including of their subtenants or co-residents.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"allowable hours days moves large item transport monday to saturday 9am 5pm\">\n          <h3 id=\"mv-hours\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">Allowable Hours/Days<\u002Fh3>\n          <p>Moves and other large item transport may only be conducted Monday to Saturday from 9:00am to 5:00pm.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"insurance all moving companies must provide a certificate of insurance coi buildinglink\">\n          <h3 id=\"mv-insurance\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">Insurance<\u002Fh3>\n          <p>All moving companies must provide a certificate of insurance (COI). See the COI instructions on BuildingLink.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"elevator use during moves moving companies delivery companies exclusively freight elevator basement entrances waiver superintendent out of service shareholders residents moving furniture large items without moving company\">\n          <h3 id=\"mv-elevator\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">Elevator Use During Moves<\u002Fh3>\n          <p>Moving companies and delivery companies must exclusively use the Freight Elevator and basement entrances unless given a waiver by the Superintendent (for instance, if the Freight Elevator is out of service). This requirement applies equally to shareholders and residents moving furniture or large items without a moving company — the Freight Elevator must be used for all furniture, appliances, and large items regardless of who is doing the moving.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"occupancy no apartment shall be occupied by guests employees family members proprietary lease shareholder actually residing building access rules entity owner corporation trust partnership limited liability company designated individual employee trustee beneficiary spouse equivalent adult dependent children board of directors ten days advance notice six month intervals\">\n          <h3 id=\"mv-occupancy\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">Occupancy<\u002Fh3>\n          <ol style=\"padding-left: 20px;\">\n            <li style=\"margin-bottom: 10px;\">No apartment shall be occupied by guests, employees, or family members (other than as allowed by the proprietary lease) unless the Shareholder is actually residing in the apartment. When a Shareholder is not in actual, contemporaneous occupancy of the apartment, no one (other than as allowed by the proprietary lease) may occupy the apartment, except when in compliance with the Building Access rules below.<\u002Fli>\n            <li>With respect to an apartment which is owned by a corporation, trust, partnership, limited liability company or other entity (\"Entity Owner\"), which by definition is not a natural person (an \"Entity-owned Unit\"), the Entity-owned Unit may be occupied only by one or more individuals designated by the Shareholder, which individual is an employee of such Entity Owner, or a trustee or beneficiary of a trust (or such designated individual's spouse or Equivalent Adult or dependent children). The Entity Owner shall notify the Board of Directors (the \"Board\") of the identity of the designated individual whom the Entity Owner authorizes to occupy the apartment in advance in each instance, on not less than ten (10) days' advance notice. The Entity Owner may not change such designated individual more frequently than at six (6) month intervals.<\u002Fli>\n          <\u002Fol>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- COMMON AREAS -->\n      <section id=\"common-areas\" style=\"margin-top: 48px;\">\n        <div style=\"font-family: 'Jost', sans-serif; letter-spacing: 0.3em; text-transform: uppercase; font-size: 12px; color: var(--bronze-dark); margin-bottom: 6px;\">Section<\u002Fdiv>\n        <h2 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 30px; margin: 0 0 8px; border-bottom: 3px double var(--bronze); padding-bottom: 14px;\">Common Areas<\u002Fh2>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"general rules lobby elevators public halls staircases not obstructed used for any purpose other than entering leaving apartments fire exits obstructed children play public halls courts staircases elevators\">\n          <h3 id=\"ca-general\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">General Rules<\u002Fh3>\n          <p>The lobby, elevators, public halls, and staircases shall not be obstructed or used for any purpose other than entering and leaving the apartments of the Building. The fire exits shall not be obstructed in any way.<\u002Fp>\n          <p>Children shall not play in the public halls, courts, staircases or elevators.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"deadbolts digital doorbells apartment doors belong to the building not to each unit cannot be changed altered without approval no additional locks deadbolts digital doorbells exterior apartment door doorframe\">\n          <h3 id=\"ca-deadbolts\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">Deadbolts and Digital Doorbells<\u002Fh3>\n          <p>Apartment doors belong to the Building, not to each Unit. They cannot be changed or altered without approval.<\u002Fp>\n          <p>No additional locks/deadbolts, digital doorbells, etc. may be added or placed on the exterior of any apartment door (or on the doorframe) without approval.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"hallways no sign decoration artwork hung common areas doors apartment units doormats shoes footwear luggage umbrella baskets stored inside apartment bikes strollers walkers furniture personal effects public hallways staircases wires cable tv internet track visible hallway animals fed terraces courtyards penalties repeated notification billed correction hallway-side wires cable tracks labor remediate violation repair common space\">\n          <h3 id=\"ca-hallways\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">Hallways<\u002Fh3>\n          <p>No sign, decoration or artwork may be hung in common areas, including on doors to apartment units or in the hallways.<\u002Fp>\n          <p>Doormats, shoes and footwear, luggage and containers such as umbrella baskets must be stored inside each apartment, not left in the hallway.<\u002Fp>\n          <p>Bikes, strollers, walkers, furniture, shoes, umbrellas, and other personal effects may not be left in the public hallways, staircases, or other common areas.<\u002Fp>\n          <p>Wires (such as for cable TV or internet service) from the hallway must come directly into an apartment from the existing track without being visible in the hallway/common areas. No wires, additional tracks or covers may be run or placed on the common area walls.<\u002Fp>\n          <p>No animals may be fed in any of the common areas, including the limited common areas such as terraces and courtyards.<\u002Fp>\n          <div style=\"border-top: 3px double var(--bronze); border-bottom: 3px double var(--bronze); background: var(--bronze-tint); padding: 16px 20px; margin-top: 16px;\">\n            <strong style=\"font-family: 'Jost', sans-serif; font-size: 15px; display: block; margin-bottom: 8px;\">Penalties<\u002Fstrong>\n            <ul style=\"margin: 0; padding-left: 20px;\">\n              <li>On repeated notification, penalties may be assessed for violation.<\u002Fli>\n              <li>The Shareholder will be billed for the correction of any hallway-side wires or cable tracks, including the labor to remediate the violation and repair the common space.<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"the building lobby no client of any person who does business from an apartment shall use lobby as waiting area no drop-shipment operations run through building lobby\">\n          <h3 id=\"ca-lobby\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">The Building Lobby<\u002Fh3>\n          <p>No client of any person who does business from an apartment in the Building shall use the lobby as a waiting area.<\u002Fp>\n          <p>No drop-shipment operations shall be run through the Building lobby.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"pets all pets must be leashed confined to carriers transported elevators common areas\">\n          <h3 id=\"ca-pets\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">Pets<\u002Fh3>\n          <p>All pets must be leashed or confined to carriers when transported on the elevators and through common areas.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"the laundry room laundry facilities used in such manner such times management board direct no warranty representation functioning laundry facilities user's own risk items left unclaimed 48 hours discarded wheeled laundry carts chairs not to be taken out video footage charge shareholder cost of replacement\">\n          <h3 id=\"ca-laundry\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">The Laundry Room<\u002Fh3>\n          <p>The laundry facilities in the laundry room shall be used in such manner and at such times as Management or the Board may direct. The Board makes no warranty or representation as to the functioning of the laundry facilities, and the use of such facilities is at the user's own risk.<\u002Fp>\n          <p>Items left unclaimed in the laundry room longer than 48 hours may be discarded.<\u002Fp>\n          <p>Building property such as the wheeled laundry carts and chairs are not to be taken out of the Laundry Room. If these items go missing, the building will review its video footage and will charge the Shareholder for the cost of replacement.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- STORAGE / BICYCLES / EBIKES -->\n      <section id=\"storage\" style=\"margin-top: 48px;\">\n        <div style=\"font-family: 'Jost', sans-serif; letter-spacing: 0.3em; text-transform: uppercase; font-size: 12px; color: var(--bronze-dark); margin-bottom: 6px;\">Section<\u002Fdiv>\n        <h2 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 30px; margin: 0 0 8px; border-bottom: 3px double var(--bronze); padding-bottom: 14px;\">Storage Lockers, Bicycle Storage and eBikes<\u002Fh2>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"storage lockers available to rent as an amenity cost subject to change board discretion proprietary lease paragraph 29b liability damage stored property only shareholders may rent sublettors may not one storage locker waitlist go up down size suspected offering locker subtenant sublease lose access monthly maintenance special assessments payments current receive maintain access\">\n          <h3 id=\"st-lockers\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">Storage Lockers<\u002Fh3>\n          <p>Lockers are available to rent as an amenity. Cost are subject to change at the Board's discretion.<\u002Fp>\n          <p style=\"margin-bottom: 8px;\">Policies:<\u002Fp>\n          <p style=\"margin-top: 0;\">In addition to all the pertinent sections of the Proprietary Lease, including the Co-Op's lack of liability for any damage to stored property per ¶29(b):<\u002Fp>\n          <ol style=\"padding-left: 20px;\">\n            <li>Only shareholders may rent the storage lockers. Sublettors may not.<\u002Fli>\n            <li style=\"margin-top: 8px;\">Each unit may only have one storage locker as long as there is a waitlist\n              <ol style=\"list-style-type: lower-alpha; padding-left: 20px; margin-top: 6px;\">\n                <li>Residents can waitlist to either go up or down in locker size, but may only rent one locker at a time<\u002Fli>\n              <\u002Fol>\n            <\u002Fli>\n            <li style=\"margin-top: 8px;\">If a shareholder who sublets their unit is suspected of offering a locker to a subtenant as part of a sublease, they will lose access to the locker. This will be determined solely by the Board.<\u002Fli>\n            <li style=\"margin-top: 8px;\">Monthly maintenance, special assessments and storage locker payments must be kept current to receive and/or maintain access to a storage space.<\u002Fli>\n          <\u002Fol>\n        <\u002Fdiv>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"bicycle spots bicycle storage available to rent as an amenity cost subject to change board discretion shareholders preference over sublettors waitlist bicycles kept in assigned spaces bike not registered locked released payment of a fine monthly maintenance special assessments bike storage payments current\">\n          <h3 id=\"st-bicycle\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">Bicycle Spots<\u002Fh3>\n          <p>Bicycle storage is available to rent as an amenity. Cost are subject to change at the Board's discretion.<\u002Fp>\n          <p style=\"margin-bottom: 8px;\">Policies:<\u002Fp>\n          <ol style=\"padding-left: 20px; margin-top: 0;\">\n            <li>Shareholders will be given preference over sublettors if there is a waitlist<\u002Fli>\n            <li>Bicycles must be kept in their assigned spaces.<\u002Fli>\n            <li>Any bike not registered will be immediately locked and released with payment of a fine at the Board's discretion.<\u002Fli>\n            <li>Monthly maintenance, special assessments, and bike storage payments must be kept current to receive and/or maintain access to a space.<\u002Fli>\n          <\u002Fol>\n        <\u002Fdiv>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"ebikes hoverboards electric scooters not allowed anywhere on the property may not be charged anywhere fire risk 1st violation property confiscated disposed unless immediately taken out of the building 2nd violation board consider actions violation of proprietary lease sublettors board move immediately cancel sublease remove subtenant paragraph 31c unauthorized occupancy financial impact wholly between shareholder subtenant to resolve\">\n          <h3 id=\"st-ebikes\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">eBikes<\u002Fh3>\n          <p>E-bikes, hoverboards and electric scooters <strong>are not allowed anywhere on the property, and may not be charged anywhere in the Building, due to fire risk.<\u002Fstrong><\u002Fp>\n          <div style=\"border-top: 3px double var(--bronze); border-bottom: 3px double var(--bronze); background: var(--bronze-tint); padding: 16px 20px; margin-top: 16px;\">\n            <p style=\"margin: 0 0 8px;\"><strong>On 1st violation,<\u002Fstrong> the property will be confiscated and disposed of unless immediately taken out of the building.<\u002Fp>\n            <p style=\"margin: 0 0 8px;\"><strong>On 2nd violation,<\u002Fstrong> in addition to immediately confiscating the property:<\u002Fp>\n            <ul style=\"margin: 0; padding-left: 20px;\">\n              <li>The Board will consider the actions to be a violation of the Proprietary Lease.<\u002Fli>\n              <li>For sublettors, the Board may move to immediately cancel the sublease and then remove the subtenant under ¶31(c) [Unauthorized Occupancy]. Any financial impact of these actions will be wholly between the Shareholder and the Subtenant to resolve.<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- INSURANCE REQUIREMENTS -->\n      <section id=\"insurance\" style=\"margin-top: 48px;\">\n        <div style=\"font-family: 'Jost', sans-serif; letter-spacing: 0.3em; text-transform: uppercase; font-size: 12px; color: var(--bronze-dark); margin-bottom: 6px;\">Section<\u002Fdiv>\n        <h2 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 30px; margin: 0 0 8px; border-bottom: 3px double var(--bronze); padding-bottom: 14px;\">Insurance Requirements<\u002Fh2>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"for shareholders all shareholders must carry homeowners insurance liability coverage not less than 1 million protects against claims guests neighboring residents building incidents originating shareholder's apartment master insurance policy does not cover damage individual apartments contents leak fire\">\n          <h3 id=\"in-shareholders\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">For Shareholders<\u002Fh3>\n          <p>All shareholders must carry homeowners' insurance with liability coverage of not less than $1 million. This liability coverage protects against claims by guests, neighboring residents, and the Building arising from incidents originating in the shareholder's apartment. The Building's master insurance policy does not cover damage to individual apartments or their contents in the event of a leak, fire, etc.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"for sublets shareholders subletting apartment must carry landlord-specific policy renewals include proof of continuing insurance\">\n          <h3 id=\"in-sublets\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">For Sublets<\u002Fh3>\n          <p>Shareholders who are subletting their apartment(s) must carry a Landlord-specific policy. All renewals must include proof of continuing insurance.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"insurance monitoring building may engage third-party insurance compliance service collect verify proof of insurance shareholders subtenants responsible keeping insurance information current non-compliance consequences of non-compliance section\">\n          <h3 id=\"in-monitoring\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">Insurance Monitoring<\u002Fh3>\n          <p>The Building may engage a third-party insurance compliance service to collect and verify proof of insurance. Shareholders and subtenants are responsible for keeping their insurance information current with that service. Non-compliance is subject to the consequences described under the Consequences of Non-Compliance section of these House Rules.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- APARTMENT ACCESS -->\n      <section id=\"access\" style=\"margin-top: 48px;\">\n        <div style=\"font-family: 'Jost', sans-serif; letter-spacing: 0.3em; text-transform: uppercase; font-size: 12px; color: var(--bronze-dark); margin-bottom: 6px;\">Section<\u002Fdiv>\n        <h2 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 30px; margin: 0 0 8px; border-bottom: 3px double var(--bronze); padding-bottom: 14px;\">Apartment Access<\u002Fh2>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"apartment access proprietary lease paragraph 25 shareholders subtenants must allow access after reasonable notice building staff contractors perform repairs emergency building staff contractors enter any apartment any time of day without notice make facilitate repairs shareholders occupants may not deny access\">\n          <h3 id=\"acc-access\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">Apartment Access<\u002Fh3>\n          <p>As noted in the Proprietary Lease ¶25, Shareholders and subtenants must allow access after reasonable notice for Building staff and contractors to perform repairs. In an emergency, the Building (and its staff or contractors) may enter any apartment at any time of day without notice to make or facilitate repairs. Shareholders and occupants may not deny access.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"registered guest access residents may have overnight guests renting out apartment short-term basis swap violation new york law building's governing documents severe penalties termination proprietary lease eviction requirements shareholder present family guests non-family guests without shareholder present family guests proof familial relationship non-family guests approved pattern suggest hotel short-term rental stays not exceed one month requests not exceed three months special arrangements board service providers pet sitters walkers brokers housekeepers one year interview doormen video footage pretext enable entry non-service providers requests entered 24 hours before start date missing incorrect information delay denial guest requests not approved incomplete contact information\">\n          <h3 id=\"acc-guest\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">Registered Guest Access<\u002Fh3>\n          <p>Residents may have overnight guests, but renting out an apartment on a short-term basis, or engaging in any swap or similar arrangement, is a violation of New York law and the Building's governing documents and will result in severe penalties up to and including termination of the Proprietary Lease and eviction.<\u002Fp>\n          <p style=\"margin-bottom: 6px;\"><strong>Requirements<\u002Fstrong><\u002Fp>\n          <p style=\"margin-top: 0;\">With the Shareholder present in the apartment, guest approval may be granted to family guests and non-family guests.<\u002Fp>\n          <p>Without the Shareholder present, guest approval may be granted to:<\u002Fp>\n          <ul style=\"padding-left: 20px;\">\n            <li>Family Guests\n              <ul style=\"padding-left: 20px; margin-top: 6px;\">\n                <li>Repeated requests for family guests to stay without a resident present may result in Management asking for proof of familial relationship.<\u002Fli>\n              <\u002Ful>\n            <\u002Fli>\n            <li style=\"margin-top: 8px;\">Non-Family Guests\n              <ul style=\"padding-left: 20px; margin-top: 6px;\">\n                <li>Requests in this group may be approved as long as Management does not see a pattern to suggest the unit is being used as a hotel or short-term rental. Management shall make this determination in its sole discretion.<\u002Fli>\n                <li>Stays may not exceed one month and requests may not exceed three months unless special arrangements are made with the Board.<\u002Fli>\n              <\u002Ful>\n            <\u002Fli>\n            <li style=\"margin-top: 8px;\">Service Providers such as pet sitters/walkers, brokers, housekeepers, etc.\n              <ul style=\"padding-left: 20px; margin-top: 6px;\">\n                <li>Requests may be for up to one year at a time; an interview of the doormen and video footage may be used if the building believes this category is being used as a pretext to enable entry to non-service providers.<\u002Fli>\n              <\u002Ful>\n            <\u002Fli>\n          <\u002Ful>\n          <p>All requests must be entered 24 hours before the start date to ensure timely approval. Missing or incorrect information may result in delay or denial of access.<\u002Fp>\n          <p>Guest requests will not be approved for any unit in which the resident's required contact information is incomplete.<\u002Fp>\n          <p style=\"margin-bottom: 6px;\"><strong>Process<\u002Fstrong><\u002Fp>\n          <ol style=\"margin-top: 0; padding-left: 20px;\">\n            <li>All Guest Access request information must be entered into BuildingLink and approved before a guest will be allowed entry without accompaniment.<\u002Fli>\n            <li>All the required information must be entered; Management will only review requests when complete information is received.<\u002Fli>\n          <\u002Fol>\n          <p style=\"margin-bottom: 6px;\"><strong>Key Policies<\u002Fstrong><\u002Fp>\n          <ul style=\"margin-top: 0; padding-left: 20px;\">\n            <li>The doormen have been instructed not to allow access for any guests who have not been approved.<\u002Fli>\n            <li>Only KeyLink keys may be given to guests by the front desk. No keys in envelopes are to be left for the doormen to distribute.<\u002Fli>\n          <\u002Ful>\n          <p style=\"margin-bottom: 6px;\"><strong>Unregistered Visitors<\u002Fstrong><\u002Fp>\n          <p style=\"margin-top: 0;\">The doormen will call residents to ensure any drop-by visitors are allowed to proceed into the building. This will be done at each visit for unregistered guests, even if a guest is familiar to the doormen.<\u002Fp>\n          <p>If a doorman believes a short-term visitor is seeing a resident who is not physically in the building, they may request (in their sole discretion) that the resident meet the guest in person in the lobby. The doormen may not, under any circumstances, be abused for this decision.<\u002Fp>\n          <p>Violations of the access privilege may result in severe penalties, including termination of the Proprietary Lease and eviction.<\u002Fp>\n        <\u002Fdiv>\n\n      <\u002Fsection>\n\n      <!-- APARTMENT KEYS -->\n      <section id=\"keys\" style=\"margin-top: 48px;\">\n        <div style=\"font-family: 'Jost', sans-serif; letter-spacing: 0.3em; text-transform: uppercase; font-size: 12px; color: var(--bronze-dark); margin-bottom: 6px;\">Section<\u002Fdiv>\n        <h2 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 30px; margin: 0 0 8px; border-bottom: 3px double var(--bronze); padding-bottom: 14px;\">Apartment Keys<\u002Fh2>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"keys for management staff building's contractors proprietary lease paragraph 25 requires all shareholders provide a key to each lock lock altered new lock installed lessee provide lessor key immediately upon installation co-op discovers missing keys unit immediately change locks bill cost back to shareholder without notice keys securely maintained by building not available to shareholders inadvertent lock-out\">\n          <h3 id=\"ky-management\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">Keys for Management, Staff and the Building's Contractors<\u002Fh3>\n          <p>The Proprietary Lease (¶25) requires all Shareholders to provide \"a key to each lock providing access to the Apartment or the storage rooms, and if any lock shall be altered or new lock installed, the Lessee shall provide the Lessor with a key thereto immediately upon installation.\" Please review this section of the Proprietary Lease for all the terms of how these keys may be used.<\u002Fp>\n          <p>If the co-op discovers it is missing the keys to any unit, it will immediately change the locks and bill the cost back to the Shareholder without notice.<\u002Fp>\n          <p>These keys will be securely maintained by the Building and are not available to Shareholders in case of inadvertent lock-out.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"keys for visitors brokers other guests building maintains system front desk keylink electronic key management registered occupants inadvertently lock themselves out guests visitors authorized contractors brokers dog sitters voluntary encouraged avoid locksmith building only give out keys approved by management in buildinglink registered shareholders subtenants phone approval not permissible keys will not be given to unregistered guests no spare keys front desk doormen pick-up guests doormen only release keys from keylink\">\n          <h3 id=\"ky-visitors\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">Keys for Visitors, Brokers and Other Guests<\u002Fh3>\n          <p>The building maintains a system at the front desk (KeyLink) for electronic key management that registered occupants can use when they inadvertently lock themselves out. These keys can also be given to guests &amp; visitors as well as to authorized contractors like brokers and dog sitters. This system is voluntary for Shareholders but encouraged (to avoid the need for a locksmith when inadvertently locked out).<\u002Fp>\n          <ol style=\"padding-left: 20px;\">\n            <li>The building will only give out these keys to those who have been approved by Management in BuildingLink, or to registered Shareholders and subtenants. Phone approval is not permissible, and keys will not be given to unregistered guests, no matter how familiar the doormen are with the visitor.<\u002Fli>\n            <li>No \"spare keys\" may be left at the front desk/with the doormen for pick-up and use by guests. The doormen may only release the keys from KeyLink.<\u002Fli>\n          <\u002Fol>\n        <\u002Fdiv>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"interior bars apartment entry doors may not have an inside locking bar\">\n          <h3 id=\"ky-bars\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">Interior Bars<\u002Fh3>\n          <p>Apartment entry doors may not have an inside locking bar.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- SUBLETTING -->\n      <section id=\"subletting\" style=\"margin-top: 48px;\">\n        <div style=\"font-family: 'Jost', sans-serif; letter-spacing: 0.3em; text-transform: uppercase; font-size: 12px; color: var(--bronze-dark); margin-bottom: 6px;\">Section<\u002Fdiv>\n        <h2 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 30px; margin: 0 0 8px; border-bottom: 3px double var(--bronze); padding-bottom: 14px;\">Subletting<\u002Fh2>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"subletting policies proprietary lease shareholders seeking sublease apartments submit completed sublet application domecile mandatory rider for subleases renewal incorporate by reference most recent version house rules 30-day application-to-lease-start minimum application date orsid 3-day approval-to-move-in minimum incoming subtenant occupancy furniture boxes belongings three business days board written approval front-desk registration cois departing resident access list shareholders may not sublet first three years after purchase minimum lease term one year shorter-term rentals subleases prohibited renewals minimum lease term one year month-to-month leases prohibited maximum single lease term two years building does not grant short-term extensions full renewal application domecile no apartment maintained hotel bed and breakfast transient accommodation consideration first class residence board and management sublease renewals domecile approval not automatic responsibility shareholder file renewal application before expiration board may withhold sublease approval for any reason arrears pattern of complaints good standing disputes history complaints ineligible sublet renew proof shareholder's liability insurance subtenant's renter's insurance one million subtenants keep required contact information email phone number emergency contact photo shareholders sublet maintain email phone number emergency contact photo current address only occupants listed sublease application approved by board reside apartment minor children full-time occupant roommate not considered guest approved by management board rent maintenance revised amended revoked board no grandfathering\">\n          <h3 id=\"sl-policies\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">Subletting Policies<\u002Fh3>\n          <p>In addition to all the pertinent sections of the Proprietary Lease:<\u002Fp>\n          <ol style=\"padding-left: 20px;\">\n            <li>All Shareholders seeking to sublease their apartments are required to submit a completed Sublet Application via Domecile.\n              <ol style=\"list-style-type: lower-alpha; padding-left: 20px; margin-top: 6px;\">\n                <li>All sublets must include the Building's Mandatory Rider for Subleases, which is part of the Sublet Application.<\u002Fli>\n                <li>Any renewal of a sublet must incorporate by reference the most recent version of the House Rules.<\u002Fli>\n                <li>30-Day Application-to-Lease-Start Minimum: All sublease applications and renewals must have a new lease start date that is at a minimum 30 days after the application date. The application date is considered the date the full package and fees are received by Orsid.<\u002Fli>\n                <li>3-Day Approval-to-Move-In Minimum: No incoming subtenant, nor anyone acting on their behalf, may take occupancy of the apartment or move any furniture, boxes, or belongings into it earlier than three (3) business days after the Board's written approval of the application. This buffer allows time for access setup, front-desk registration, COIs, and removal of any departing resident from the access list.<\u002Fli>\n              <\u002Fol>\n            <\u002Fli>\n            <li>Shareholders may not sublet for the first three years after purchase.<\u002Fli>\n            <li>All sublets must be for a minimum lease term of one (1) year. Shorter-term rentals and subleases are prohibited.<\u002Fli>\n            <li>All renewals must be for a minimum lease term of one (1) year. Month-to-month leases are prohibited.<\u002Fli>\n            <li>The maximum single lease term accepted is for two (2) years.<\u002Fli>\n            <li>The Building does not grant short-term extensions of an approved sublease. Any continuation of occupancy beyond the approved lease term requires a full renewal application via Domecile, subject to the one-year minimum and two-year maximum terms above. An expiring lease may not be extended by weeks or months in lieu of a proper renewal.<\u002Fli>\n            <li>No apartment may be maintained as a \"hotel\", \"bed and breakfast\", or other transient accommodation, whether consideration changes hands or not, or in any other manner such that occupants are shuttled in and out. The Building has been and will continue to be operated as a first class residence for the benefit of all of its Shareholders and designated occupants who have been identified to the Board and Management.<\u002Fli>\n            <li>Sublease renewals are handled via Domecile and are subject to approval, which is not automatic. It is the responsibility of the Shareholder to file a sublease renewal application before the expiration of a sublease.<\u002Fli>\n            <li>The Board may withhold sublease approval for any reason or for no reason. The Board will not consider sublet applications or renewals from any unit in arrears, any unit with a pattern of complaints from neighbors, or from any Shareholder or subtenant not in good standing, as determined by the Board. Any disputes or history of complaints may make a unit ineligible to be sublet or subtenants ineligible to renew their sublease.<\u002Fli>\n            <li>All sublet applications and renewals must include proof of the Shareholder's liability insurance and Subtenant's renter's insurance with limits of liability not less than $1 million to obtain approval. Renewal paperwork must be accompanied by continuing proof of insurance.<\u002Fli>\n            <li>Subtenants must keep required contact information – email, phone number, emergency contact and photo – on file in the building's system of records (such as BuildingLink). Similarly, shareholders who sublet must maintain an email, phone number, emergency contact, photo, and current address on file with both the Co-Op and the Management Company.<\u002Fli>\n            <li>Only occupants listed on the sublease application that have been approved by the Board may reside in the apartment (excepting minor children listed on the application or brought into the family during residence). Any adult who moves into the building as a full-time occupant and/or roommate shall not be considered a \"guest\" and must be approved by Management and the Board to the extent the new occupant is responsible for rent or maintenance.<\u002Fli>\n          <\u002Fol>\n          <p><strong>These policies may be revised, amended or revoked at any time by the Board, and there will be no grandfathering of sublets based on prior policies.<\u002Fstrong><\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"sublet fees co-op charges two types of fees for sublets set by the board conversion fee one-time fee for converting a residence to a sublet sublet fee percentage of the unit's maintenance cost subject to change failure to file timely renewal 250 monthly penalty lease deemed unrecognized eviction proceedings ineligible to continue subletting policies and billing conversion fee assessed unit first sublet time of approval sublet fees assessed monthly no refunds credits prorating early move-
