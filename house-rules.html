out original approved lease determine extent of billing co-op may collect rent directly from subtenants non-payment shareholder proprietary lease paragraph 32b new york state case law sublet units not eligible primary residence tax abatement credits recoup mistakenly granted abatements auditing\">\n          <h3 id=\"sl-fees\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">Sublet Fees<\u002Fh3>\n          <p><strong>The Co-Op charges different types of fees for sublets, which shall be set by the Board:<\u002Fstrong><\u002Fp>\n          <ul style=\"padding-left: 20px;\">\n            <li><strong>Conversion Fee:<\u002Fstrong> A one-time fee for converting a residence to a sublet.<\u002Fli>\n            <li><strong>Sublet Fee:<\u002Fstrong> A percentage of the unit's maintenance cost, subject to change at any time.<\u002Fli>\n            <li><strong>Failure to file timely renewal:<\u002Fstrong> $250/monthly penalty for failure to file lease renewal paperwork before expiry, up to the third month. After the third month, the lease will be deemed unrecognized, the building may ask its counsel to file eviction proceedings, and the Shareholder(s) may be deemed ineligible to continue subletting the unit.<\u002Fli>\n          <\u002Ful>\n          <p>The fees above are separate from any fees that may be charged by the Management Company for its own processing of applications.<\u002Fp>\n          <p style=\"margin-bottom: 6px;\"><strong>Policies and Billing<\u002Fstrong><\u002Fp>\n          <ol style=\"margin-top: 0; padding-left: 20px;\">\n            <li>The Conversion Fee will be assessed when a unit is first sublet, at the time of approval.<\u002Fli>\n            <li>The Sublet Fees will be assessed monthly.<\u002Fli>\n            <li>No refunds, credits or prorating will be applied in the event of an early move-out. Only the original approved lease will be used to determine the extent of billing.\n              <ol style=\"list-style-type: lower-alpha; padding-left: 20px; margin-top: 6px;\">\n                <li>It is between the Shareholder and the subtenant to manage the cost of any early departures through their approved sublease terms.<\u002Fli>\n              <\u002Fol>\n            <\u002Fli>\n            <li>The Co-Op may collect rent directly from subtenants in the event of non-payment by the Shareholder, per the Proprietary Lease ¶32(b) and New York State case law.<\u002Fli>\n            <li>Sublet units are not eligible for any primary residence tax abatement credits from NY State/City, and the co-op reserves the ability to recoup the full amount of any mistakenly granted abatements at any time upon auditing.<\u002Fli>\n          <\u002Fol>\n        <\u002Fdiv>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"violations will result in eviction of the subtenant and termination of the proprietary lease\">\n          <h3 id=\"sl-violations\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">Violations<\u002Fh3>\n          <div style=\"border-top: 3px double var(--bronze); border-bottom: 3px double var(--bronze); background: var(--bronze-tint); padding: 16px 20px;\">\n            <p style=\"margin: 0;\">Violations will result in eviction of the Subtenant and termination of the Proprietary Lease.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- WORK INSIDE APARTMENTS -->\n      <section id=\"work\" style=\"margin-top: 48px;\">\n        <div style=\"font-family: 'Jost', sans-serif; letter-spacing: 0.3em; text-transform: uppercase; font-size: 12px; color: var(--bronze-dark); margin-bottom: 6px;\">Section<\u002Fdiv>\n        <h2 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 30px; margin: 0 0 8px; border-bottom: 3px double var(--bronze); padding-bottom: 14px;\">Work Inside Apartments<\u002Fh2>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"workdays no construction repair alteration similar work conducted in any apartment on weekends or holidays regular business days 9am 5pm alteration agreement approved executed housekeepers cleaners handypersons monday through saturday 9am 5pm excluding holidays coi requirements furniture assembly large-item handling approved alteration agreement days hours control resident's personal activity unreasonable noise standard regardless day time\">\n          <h3 id=\"wk-workdays\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">Workdays<\u002Fh3>\n          <p>No construction, repair, alteration, or similar work shall be conducted in any apartment on weekends or holidays. Such work is permitted only on regular business days between 9:00am and 5:00pm, and, where an Alteration Agreement is required, only after that Agreement has been approved and executed.<\u002Fp>\n          <p>Any person performing services or work in an apartment — eg housekeepers, cleaners, and handypersons — may perform such services only Monday through Saturday, 9:00am to 5:00pm, excluding holidays. If their work is also subject to the Building's COI requirements (such as furniture assembly or large-item handling) or requires an approved Alteration Agreement, the days and hours permitted under those rules control. This provision governs persons performing services or work; it does not restrict a resident's personal activity in their apartment, which remains subject only to the Unreasonable Noise standard regardless of the day or time.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"limits on diy shareholders residents strictly prohibited performing work themselves building's electrical plumbing gas systems removal installation structural modification walls windows floors ceilings hardwired lighting cabinets toilets bathtubs vanities sinks faucets ovens ranges dishwashers window ac units bath kitchen fixture licensed contractor properly insured alteration agreement\">\n          <h3 id=\"wk-diy\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">Limits on DIY<\u002Fh3>\n          <p>Shareholders and residents are strictly prohibited from performing any work themselves that involves the Building's electrical, plumbing, and gas systems, or work that includes removal, installation, or structural modification of any walls, windows, floors, ceilings, hardwired lighting, cabinets, toilets, bathtubs, vanities, sinks, faucets, ovens/ranges, dishwashers, window AC units, or any other bath or kitchen fixture. Such work must be performed by a licensed contractor, be properly insured, and adhere to the requirements of the Alteration Agreement.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"renovation duration apartment renovations shall not exceed shorter of time period authorized management approved alteration agreement six months board written approval renovations exceed six months cease conclusion of 183 days until board authorizes additional time complete work\">\n          <h3 id=\"wk-duration\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">Renovation Duration<\u002Fh3>\n          <p>Apartment renovations shall not exceed the shorter of (a) the time period authorized by Management in connection with an approved Alteration Agreement, or (b) six months, unless otherwise approved in writing by the Board. Renovations that exceed six months must cease at the conclusion of 183 days until the Board authorizes in writing additional time to complete the work.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"certificate of insurance coi requirements all contractors performing work apartment must provide certificate of insurance naming co-op corporation additional insured management alteration agreement liability insurance workers compensation coverage additional coverages sole discretion board management coi instructions on buildinglink\">\n          <h3 id=\"wk-coi\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">Certificate of Insurance (COI) Requirements<\u002Fh3>\n          <p>All contractors performing work in an apartment must provide a Certificate of Insurance (COI) naming the Co-op Corporation as an additional insured to Management, as detailed in the Building's Alteration Agreement. This insurance must include liability insurance, workers compensation coverage, and such additional coverages as required in the sole discretion of the Board or Management. See the COI Instructions on BuildingLink for detailed instructions that can be sent to your contractor.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"riser replacement initiative adjacent apartment bathroom kitchen renovation building staff contractors require access to change risers essential long-term project shareholders subtenants must cooperate building shall pay for any demolition repair of apartments adjacent to those undergoing renovation tile demolished building not obligated to replace it with identical tile\">\n          <h3 id=\"wk-riser\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">Riser Replacement Initiative<\u002Fh3>\n          <p>If an adjacent apartment is undergoing a bathroom or kitchen renovation, Building staff and contractors may require access to change the riser(s) serving the apartment. The replacement of risers is an essential long-term project and Shareholders and subtenants must cooperate with requests for access to perform such work. The Building shall pay for any demolition and repair of apartments adjacent to those undergoing renovation; however, to the extent that tile must be demolished, the Building is not obligated to replace it with identical tile.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"state of good repair every shareholder obligated to keep apartment fixtures equipment state of good repair proprietary lease paragraph 19 grants co-op right to remedy deficiencies charge back costs repairs unfinished renovation shareholder co-op may inspect apartments objectionable condition\">\n          <h3 id=\"wk-repair\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">State of Good Repair<\u002Fh3>\n          <p>Every Shareholder is obligated to keep their apartment, its fixtures and its equipment in a state of good repair, and the Proprietary Lease in ¶19 grants the Co-Op a right to remedy any deficiencies and charge back the costs of any repairs or unfinished renovation to the Shareholder.<\u002Fp>\n          <p>From time to time, the co-op may inspect apartments to ensure that all units are not left in an objectionable condition.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"right to enter proprietary lease paragraph 25 lessor agents authorized workmen permitted to visit examine enter apartment storage space assigned to lessee any reasonable hour of the day upon notice any time without notice emergency make facilitate repairs cure default remove portions of walls floors ceilings restore apartment proper usual condition lessor's expense lessee's expense caused by act omission lessee family guests agents employees subtenants\">\n          <h3 id=\"wk-enter\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">Right to Enter<\u002Fh3>\n          <p>As noted in the Proprietary Lease ¶25, \"The Lessor and its agents and their authorized workmen shall be permitted to visit, examine, or enter the Apartment and any storage space assigned to Lessee at any reasonable hour of the day upon notice, or at any time and without notice in case of emergency to make or facilitate repairs in any part of the Building or to cure any default by the Lessee and to remove such portions of the walls, floors and ceilings of the Apartment and storage space as may be required for any such purpose, but the Lessor shall thereafter restore the Apartment and storage space to its proper and usual condition at Lessor's expense if such repairs are the obligation of Lessor or at Lessee's expense if such repairs are the obligation of Lessee or are caused by the act or omission of the Lessee or any of the Lessee's family, guests, agents, employees or subtenants.\"<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- SAFETY -->\n      <section id=\"safety\" style=\"margin-top: 48px;\">\n        <div style=\"font-family: 'Jost', sans-serif; letter-spacing: 0.3em; text-transform: uppercase; font-size: 12px; color: var(--bronze-dark); margin-bottom: 6px;\">Section<\u002Fdiv>\n        <h2 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 30px; margin: 0 0 8px; border-bottom: 3px double var(--bronze); padding-bottom: 14px;\">Safety<\u002Fh2>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"flammable material no shareholder guest family member roommate invitee agent service provider subtenant shall at any time bring into or keep in any apartment any inflammable combustible hazardous explosive fluid material chemical substance necessary appropriate permitted uses prior authorization superintendent\">\n          <h3 id=\"sf-flammable\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">Flammable Material<\u002Fh3>\n          <p>No Shareholder or guest, family member, roommate, invitee, agent, service provider or Subtenant shall at any time bring into or keep in any apartment any inflammable, combustible, hazardous or explosive fluid, material, chemical or other substance, except as shall be necessary and appropriate for the permitted uses of such apartment and with the prior authorization of the Superintendent.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"elevators the service elevator shall be operated only by building employees\">\n          <h3 id=\"sf-elevators\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">Elevators<\u002Fh3>\n          <p>The service elevator shall be operated only by Building employees.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"work by staff no shareholder building occupant shall send any building employee out of the building on any private business during work hours\">\n          <h3 id=\"sf-staff\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">Work by Staff<\u002Fh3>\n          <p>No Shareholder/Building occupant shall send any building employee out of the Building on any private business during work hours.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"hr-block\" data-block=\"1\" data-search-text=\"fire notices new york city fire regulations require all shareholders subtenants permitted occupants affix inside front door apartment fire safety plan copies of the plan available from management\">\n          <h3 id=\"sf-fire\" style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px; scroll-margin-top: 108px;\">Fire Notices<\u002Fh3>\n          <p>New York City Fire Regulations require all Shareholders as well as any Subtenants or other permitted occupants, to affix to the inside of the front door of the apartment a fire safety plan. All Shareholders and Subtenants must attach said plan. Copies of the plan are available from Management.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- CONSEQUENCES OF NON-COMPLIANCE -->\n      <section id=\"compliance\" class=\"hr-block\" data-block=\"1\" data-search-text=\"consequences of non-compliance repeated violations of these house rules shareholder guests family members roommates business invitees agents employees subtenants escalating fines additional maintenance any other actions authorized proprietary lease sublease termination of the proprietary lease or sublease\" style=\"margin-top: 48px; border-top: 3px double var(--bronze); border-bottom: 3px double var(--bronze); background: #ece5cd; padding: 22px 26px;\">\n        <div style=\"font-family: 'Jost', sans-serif; letter-spacing: 0.22em; text-transform: uppercase; font-size: 11px; color: var(--bronze-dark); margin-bottom: 6px;\">A Final Word<\u002Fdiv>\n        <h2 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 20px; margin: 0 0 12px;\">Consequences of Non-Compliance<\u002Fh2>\n        <p style=\"margin: 0;\">Repeated violations of these House Rules by a Shareholder or guests, family members, roommates, business invitees, agents, employees, or Subtenants may result in escalating fines (charged as additional maintenance) and/or any other actions authorized under the Proprietary Lease or Sublease, up to and including termination of the Proprietary Lease or Sublease.<\u002Fp>\n      <\u002Fsection>\n\n      <div style=\"margin-top: 64px; text-align: center;\">\n        <img src=\"2fd8cdc3-71b2-4bf5-8789-ea7fefcc54c8\" alt=\"\" style=\"width: 60px; height: auto; margin: 0 auto 14px; display: block; filter: grayscale(1) contrast(1.05); image-rendering: auto;\">\n        <div style=\"font-family: 'Jost', sans-serif; letter-spacing: 0.15em; font-size: 13px; color: var(--bronze-dark);\">433 WEST 34TH STREET &nbsp;·&nbsp; CO-OP BOARD<\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fmain>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ showBackToTop }}\" hint-placeholder-val=\"{{ false }}\">\n    <a href=\"#top\" style=\"position: fixed; bottom: 28px; right: 28px; z-index: 30; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #1e1e1e; color: #f5f2e0; text-decoration: none; font-family: 'Jost', sans-serif; font-size: 18px; border-radius: 2px; box-shadow: 0 4px 14px rgba(0,0,0,0.2);\">↑<\u002Fa>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: {&quot;width&quot;: 1400, &quot;height&quot;: 900},\n  &quot;accentColor&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#c0a000&quot;, &quot;options&quot;: [&quot;#c0a000&quot;, &quot;#8a7000&quot;, &quot;#3c6e71&quot;, &quot;#25494b&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Theme&quot;}\n}\">\nclass Component extends DCLogic {\n  static sectionIds = ['intro', 'general-policies', 'moving', 'common-areas', 'storage', 'insurance', 'access', 'keys', 'subletting', 'work', 'safety', 'compliance'];\n\n  state = { query: '', scrolled: false, activeId: 'intro', mobileNavOpen: false };\n\n  componentDidMount() {\n    this.rootEl = document.querySelector('.hr-root');\n    this._onScroll = () => {\n      const scrolled = window.scrollY > 500;\n      if (scrolled !== this.state.scrolled) this.setState({ scrolled });\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    this.applyFilter();\n    this.setupObserver();\n  }\n\n  setupObserver() {\n    const els = Component.sectionIds.map((id) => document.getElementById(id)).filter(Boolean);\n    if (!els.length) return;\n    this._observer = new IntersectionObserver((entries) => {\n      const visible = entries.filter((e) => e.isIntersecting);\n      if (visible.length) {\n        visible.sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);\n        if (this._suppressUntil && Date.now() < this._suppressUntil) return;\n        const nextId = visible[0].target.id;\n        if (nextId !== this.state.activeId) this.setState({ activeId: nextId });\n      }\n    }, { rootMargin: '-110px 0px -75% 0px', threshold: 0 });\n    els.forEach((el) => this._observer.observe(el));\n  }\n\n  componentDidUpdate() {\n    this.applyFilter();\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this._onScroll);\n    if (this._observer) this._observer.disconnect();\n  }\n\n  applyFilter() {\n    if (!this.rootEl) return;\n    const rawQuery = this.state.query.trim();\n    const q = rawQuery.toLowerCase();\n    if (!this._originalHTML) this._originalHTML = new Map();\n    const blocks = this.rootEl.querySelectorAll('[data-block]');\n    let matches = 0;\n    blocks.forEach((el) => {\n      if (!this._originalHTML.has(el)) this._originalHTML.set(el, el.innerHTML);\n      const original = this._originalHTML.get(el);\n      const text = (el.getAttribute('data-search-text') || el.textContent || '').toLowerCase();\n      const isMatch = !q || text.includes(q);\n      el.style.display = isMatch ? '' : 'none';\n      if (isMatch && q) matches++;\n      const desiredHTML = isMatch && rawQuery ? Component.highlightHTML(original, rawQuery) : original;\n      if (el.innerHTML !== desiredHTML) el.innerHTML = desiredHTML;\n    });\n    const countChanged = this._matchCount !== matches;\n    this._matchCount = matches;\n    this._matchEls = q ? Array.from(this.rootEl.querySelectorAll('mark')) : [];\n    const isNewQuery = q !== this._lastFilteredQuery;\n    this._lastFilteredQuery = q;\n    if (q && isNewQuery && this._matchEls.length) {\n      this.focusMatch(0);\n    } else if (!q) {\n      this._activeMatchIndex = -1;\n    }\n    if (countChanged) this.forceUpdate();\n  }\n\n  focusMatch(idx) {\n    if (!this._matchEls || !this._matchEls.length) return;\n    const n = this._matchEls.length;\n    const clamped = ((idx % n) + n) % n;\n    this._matchEls.forEach((el, i) => {\n      el.style.background = i === clamped ? 'var(--bronze)' : 'var(--bronze-tint)';\n      el.style.color = i === clamped ? '#fff' : 'inherit';\n    });\n    const rect = this._matchEls[clamped].getBoundingClientRect();\n    window.scrollTo({ top: window.scrollY + rect.top - 130, behavior: 'smooth' });\n    this._activeMatchIndex = clamped;\n    this.forceUpdate();\n  }\n\n  static highlightHTML(html, query) {\n    const esc = query.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&');\n    const re = new RegExp(esc, 'gi');\n    return html.split(/(<[^>]+>)/g).map((part) => (\n      part.startsWith('<') ? part : part.replace(re, (m) => `<mark>${m}<\u002Fmark>`)\n    )).join('');\n  }\n\n  renderVals() {\n    const accent = this.props.accentColor ?? '#c0a000';\n    const activeStyle = 'color: var(--bronze-dark); border-left-color: var(--bronze); font-weight: 500;';\n    const idKeyMap = {\n      intro: 'intro', 'general-policies': 'generalPolicies', moving: 'moving', 'common-areas': 'commonAreas',\n      storage: 'storage', insurance: 'insurance', keys: 'keys', access: 'access', subletting: 'subletting', work: 'work', safety: 'safety', compliance: 'compliance',\n    };\n    const navStyles = {};\n    const subOpen = {};\n    Component.sectionIds.forEach((id) => {\n      const key = idKeyMap[id];\n      navStyles[key] = id === this.state.activeId ? activeStyle : '';\n      subOpen[key] = id === this.state.activeId;\n    });\n    return {\n      themeVars: `--bronze:${accent}; --bronze-dark:color-mix(in srgb, ${accent} 65%, black); --bronze-tint:color-mix(in srgb, ${accent} 14%, #f5f2e0);`,\n      query: this.state.query,\n      hasQuery: this.state.query.trim().length > 0,\n      matchSummary: !this.state.query.trim() ? '' : (this._matchCount === 1 ? '1 section matches' : `${this._matchCount || 0} sections match \"${this.state.query.trim()}\"`),\n      onSearchInput: (e) => this.setState({ query: e.target.value }),\n      onClearSearch: () => this.setState({ query: '' }),\n      onPrevMatch: () => this.focusMatch((this._activeMatchIndex ?? 0) - 1),\n      onNextMatch: () => this.focusMatch((this._activeMatchIndex ?? -1) + 1),\n      matchNavLabel: (this._matchEls && this._matchEls.length) ? `${(this._activeMatchIndex ?? 0) + 1} of ${this._matchEls.length}` : '',\n      hasMatches: !!(this._matchEls && this._matchEls.length),\n      showBackToTop: this.state.scrolled,\n      navStyles,\n      subOpen,\n      mobileNavOpen: this.state.mobileNavOpen,\n      onMenuToggle: () => this.setState((s) => ({ mobileNavOpen: !s.mobileNavOpen })),\n      onMobileBackdropClick: (e) => {\n        if (e.target === e.currentTarget) this.setState({ mobileNavOpen: false });\n      },\n      onNavClick: (e) => {\n        const a = e.target.closest('a');\n        if (!a) return;\n        const id = (a.getAttribute('href') || '').slice(1);\n        const prefixMap = {\n          'gp-': 'general-policies', 'mv-': 'moving', 'ca-': 'common-areas', 'st-': 'storage',\n          'in-': 'insurance', 'ky-': 'keys', 'acc-': 'access', 'sl-': 'subletting', 'wk-': 'work', 'sf-': 'safety',\n        };\n        let parentId = Component.sectionIds.includes(id) ? id : null;\n        if (!parentId) {\n          const prefix = Object.keys(prefixMap).find((p) => id.startsWith(p));\n          if (prefix) parentId = prefixMap[prefix];\n        }\n        if (parentId) {\n          this._suppressUntil = Date.now() + 900;\n          this.setState({ activeId: parentId });\n        }\n        if (this.state.mobileNavOpen) this.setState({ mobileNavOpen: false });\n      },\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
