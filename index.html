document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

02Fdiv>\n\n    <div style=\"width: 380px; height: 460px; margin: 30px 0; border: 6px solid #1e1e1e; outline: 1px solid var(--bronze); outline-offset: 6px; box-sizing: border-box;\">\n      <image-slot id=\"cover-facade\" shape=\"rect\" placeholder=\"Drop a photo of the building facade or lobby\" style=\"width: 100%; height: 100%;\" src=\"38accff3-af42-4155-aa74-9749d08f77ca\"><\u002Fimage-slot>\n    <\u002Fdiv>\n\n    <div style=\"font-family: 'Work Sans', sans-serif; font-size: 13px; color: #5c5c5c; letter-spacing: 0.02em;\">Last Update: June 2026 &nbsp;·&nbsp; Prepared by the Co-op Board<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- TABLE OF CONTENTS -->\n  <section style=\"break-before: page; break-inside: avoid;\">\n    <div style=\"font-family: 'Jost', sans-serif; letter-spacing: 0.3em; text-transform: uppercase; font-size: 12px; color: var(--bronze-dark); margin-top: 34px; margin-bottom: 6px;\">Contents<\u002Fdiv>\n    <h2 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 30px; margin: 0 0 8px; border-bottom: 3px double var(--bronze); padding-bottom: 14px;\">What's Inside<\u002Fh2>\n    <ol style=\"list-style: none; margin: 24px 0 0; padding: 0; counter-reset: toc; columns: 1;\">\n      <li style=\"counter-increment: toc; display: flex; gap: 14px; padding: 8px 0; border-bottom: 1px solid color-mix(in srgb, var(--bronze) 25%, white);\"><span style=\"font-family: 'Jost', sans-serif; color: var(--bronze); width: 22px; flex-shrink: 0;\">01<\u002Fspan><a href=\"#s1\" style=\"color: #232120; text-decoration: none;\">Who to Contact<\u002Fa><\u002Fli>\n      <li style=\"counter-increment: toc; display: flex; gap: 14px; padding: 8px 0; border-bottom: 1px solid color-mix(in srgb, var(--bronze) 25%, white);\"><span style=\"font-family: 'Jost', sans-serif; color: var(--bronze); width: 22px; flex-shrink: 0;\">02<\u002Fspan><a href=\"#s2\" style=\"color: #232120; text-decoration: none;\">Moving In / Out<\u002Fa><\u002Fli>\n      <li style=\"counter-increment: toc; display: flex; gap: 14px; padding: 8px 0; border-bottom: 1px solid color-mix(in srgb, var(--bronze) 25%, white);\"><span style=\"font-family: 'Jost', sans-serif; color: var(--bronze); width: 22px; flex-shrink: 0;\">03<\u002Fspan><a href=\"#s3\" style=\"color: #232120; text-decoration: none;\">Utilities<\u002Fa><\u002Fli>\n      <li style=\"counter-increment: toc; display: flex; gap: 14px; padding: 8px 0; border-bottom: 1px solid color-mix(in srgb, var(--bronze) 25%, white);\"><span style=\"font-family: 'Jost', sans-serif; color: var(--bronze); width: 22px; flex-shrink: 0;\">04<\u002Fspan><a href=\"#s4\" style=\"color: #232120; text-decoration: none;\">BuildingLink: Our Primary Communication Tool<\u002Fa><\u002Fli>\n      <li style=\"counter-increment: toc; display: flex; gap: 14px; padding: 8px 0; border-bottom: 1px solid color-mix(in srgb, var(--bronze) 25%, white);\"><span style=\"font-family: 'Jost', sans-serif; color: var(--bronze); width: 22px; flex-shrink: 0;\">05<\u002Fspan><a href=\"#s5\" style=\"color: #232120; text-decoration: none;\">Garbage / Recycling<\u002Fa><\u002Fli>\n      <li style=\"counter-increment: toc; display: flex; gap: 14px; padding: 8px 0; border-bottom: 1px solid color-mix(in srgb, var(--bronze) 25%, white);\"><span style=\"font-family: 'Jost', sans-serif; color: var(--bronze); width: 22px; flex-shrink: 0;\">06<\u002Fspan><a href=\"#s6\" style=\"color: #232120; text-decoration: none;\">Laundry<\u002Fa><\u002Fli>\n      <li style=\"counter-increment: toc; display: flex; gap: 14px; padding: 8px 0; border-bottom: 1px solid color-mix(in srgb, var(--bronze) 25%, white);\"><span style=\"font-family: 'Jost', sans-serif; color: var(--bronze); width: 22px; flex-shrink: 0;\">07<\u002Fspan><a href=\"#s7\" style=\"color: #232120; text-decoration: none;\">Maintenance and Repairs<\u002Fa><\u002Fli>\n      <li style=\"counter-increment: toc; display: flex; gap: 14px; padding: 8px 0; border-bottom: 1px solid color-mix(in srgb, var(--bronze) 25%, white);\"><span style=\"font-family: 'Jost', sans-serif; color: var(--bronze); width: 22px; flex-shrink: 0;\">08<\u002Fspan><a href=\"#s8\" style=\"color: #232120; text-decoration: none;\">Insurance Requirements<\u002Fa><\u002Fli>\n      <li style=\"counter-increment: toc; display: flex; gap: 14px; padding: 8px 0; border-bottom: 1px solid color-mix(in srgb, var(--bronze) 25%, white);\"><span style=\"font-family: 'Jost', sans-serif; color: var(--bronze); width: 22px; flex-shrink: 0;\">09<\u002Fspan><a href=\"#s9\" style=\"color: #232120; text-decoration: none;\">Building Amenities<\u002Fa><\u002Fli>\n      <li style=\"counter-increment: toc; display: flex; gap: 14px; padding: 8px 0; border-bottom: 1px solid color-mix(in srgb, var(--bronze) 25%, white);\"><span style=\"font-family: 'Jost', sans-serif; color: var(--bronze); width: 22px; flex-shrink: 0;\">10<\u002Fspan><a href=\"#s10\" style=\"color: #232120; text-decoration: none;\">Access, Deliveries and Security<\u002Fa><\u002Fli>\n      <li style=\"counter-increment: toc; display: flex; gap: 14px; padding: 8px 0; border-bottom: 1px solid color-mix(in srgb, var(--bronze) 25%, white);\"><span style=\"font-family: 'Jost', sans-serif; color: var(--bronze); width: 22px; flex-shrink: 0;\">11<\u002Fspan><a href=\"#s11\" style=\"color: #232120; text-decoration: none;\">Community Life (Pets, Noise &amp; Flooring)<\u002Fa><\u002Fli>\n      <li style=\"counter-increment: toc; display: flex; gap: 14px; padding: 8px 0; border-bottom: 1px solid color-mix(in srgb, var(--bronze) 25%, white);\"><span style=\"font-family: 'Jost', sans-serif; color: var(--bronze); width: 22px; flex-shrink: 0;\">12<\u002Fspan><a href=\"#s12\" style=\"color: #232120; text-decoration: none;\">Renovations &amp; Alterations<\u002Fa><\u002Fli>\n      <li style=\"counter-increment: toc; display: flex; gap: 14px; padding: 8px 0; border-bottom: 1px solid color-mix(in srgb, var(--bronze) 25%, white);\"><span style=\"font-family: 'Jost', sans-serif; color: var(--bronze); width: 22px; flex-shrink: 0;\">13<\u002Fspan><a href=\"#s13\" style=\"color: #232120; text-decoration: none;\">Sales<\u002Fa><\u002Fli>\n      <li style=\"counter-increment: toc; display: flex; gap: 14px; padding: 8px 0; border-bottom: 1px solid color-mix(in srgb, var(--bronze) 25%, white);\"><span style=\"font-family: 'Jost', sans-serif; color: var(--bronze); width: 22px; flex-shrink: 0;\">14<\u002Fspan><a href=\"#s14\" style=\"color: #232120; text-decoration: none;\">Subletting &amp; Short-Term Rentals (\"Hoteling\")<\u002Fa><\u002Fli>\n      <li style=\"counter-increment: toc; display: flex; gap: 14px; padding: 8px 0;\"><span style=\"font-family: 'Jost', sans-serif; color: var(--bronze); width: 22px; flex-shrink: 0;\">15<\u002Fspan><a href=\"#s15\" style=\"color: #232120; text-decoration: none;\">A Final Word: Compliance &amp; Fines<\u002Fa><\u002Fli>\n    <\u002Fol>\n  <\u002Fsection>\n\n  <!-- QUICK REFERENCE -->\n  <sc-if value=\"{{ showQuickRef }}\">\n    <section style=\"break-before: page; break-inside: avoid;\">\n      <div style=\"font-family: 'Jost', sans-serif; letter-spacing: 0.3em; text-transform: uppercase; font-size: 12px; color: var(--bronze-dark); margin-top: 34px; margin-bottom: 6px;\">Before You Read Further<\u002Fdiv>\n      <h2 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 28px; margin: 0 0 20px; border-bottom: 3px double var(--bronze); padding-bottom: 14px;\">Five Things to Know Now<\u002Fh2>\n      <div style=\"display: grid; gap: 14px;\">\n        <div style=\"border-top: 3px double var(--bronze); border-bottom: 3px double var(--bronze); background: var(--bronze-tint); padding: 16px 20px;\">\n          <strong style=\"font-family: 'Jost', sans-serif; font-size: 15px;\">Emergencies:<\u002Fstrong> Leaks, gas smells, or non-medical emergencies — notify the Superintendent and Management immediately. After hours, call the Front Desk/Doorman. See <a href=\"#s7\">Section 7<\u002Fa>.\n        <\u002Fdiv>\n        <div style=\"border-top: 3px double var(--bronze); border-bottom: 3px double var(--bronze); background: var(--bronze-tint); padding: 16px 20px;\">\n          <strong data-om-id=\"8b73f39c:75\" style=\"font-family: Jost, sans-serif; font-size: 15px;\">Moving in or out?<\u002Fstrong> Book your slot at least three days ahead, Monday–Saturday 9am–5pm only, via the service entrance and freight elevator. See <a href=\"#s2\" data-om-id=\"8b73f39c:76\">Section 2<\u002Fa>.\n        <\u002Fdiv>\n        <div style=\"border-top: 3px double var(--bronze); border-bottom: 3px double var(--bronze); background: var(--bronze-tint); padding: 16px 20px;\">\n          <strong style=\"font-family: 'Jost', sans-serif; font-size: 15px;\">Quiet hours are 10:00 PM – 8:00 AM.<\u002Fstrong> 80% of each room's floor area (excluding kitchens/baths) must be rugged to minimize noise transfer. See <a href=\"#s11\">Section 11<\u002Fa>.\n        <\u002Fdiv>\n        <div style=\"border-top: 3px double var(--bronze); border-bottom: 3px double var(--bronze); background: var(--bronze-tint); padding: 16px 20px;\">\n          <strong style=\"font-family: 'Jost', sans-serif; font-size: 15px;\">E-bikes, e-scooters, and lithium-ion batteries are banned building-wide<\u002Fstrong> — including inside apartments — per NYC Fire Department regulations. See <a href=\"#s9\">Section 9<\u002Fa>.\n        <\u002Fdiv>\n        <div style=\"border-top: 3px double var(--bronze); border-bottom: 3px double var(--bronze); background: var(--bronze-tint); padding: 16px 20px;\">\n          <strong style=\"font-family: 'Jost', sans-serif; font-size: 15px;\">Fines are real.<\u002Fstrong> The Board may issue fines for <a href=\"https://drive.google.com/file/d/1td0nfVtyZ3W3bd7VdH4TZCd_eqtDhmwf/view?usp=share_link\" target=\"_blank\">House Rules<\u002Fa> violations, charged directly to your maintenance account. See <a href=\"#s15\">Section 15<\u002Fa>.\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- INTRODUCTION -->\n  <section style=\"break-before: page; break-inside: avoid;\">\n    <div style=\"font-family: 'Jost', sans-serif; letter-spacing: 0.3em; text-transform: uppercase; font-size: 12px; color: var(--bronze-dark); margin-top: 34px; margin-bottom: 6px;\">Introduction<\u002Fdiv>\n    <h2 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 30px; margin: 0 0 8px; border-bottom: 3px double var(--bronze); padding-bottom: 14px;\">Dear Neighbor,<\u002Fh2>\n    <p style=\"margin-top: 22px;\">Welcome to 433 West 34th Street. We're thrilled to have you join our community. Built in 1929 in the classic art-deco style, 433 West 34th is more than just a building — it's a home. Whether you're a new shareholder or a renter, we hope you enjoy being at the heart of Hudson Yards, with the High Line, Manhattan West, and endless transit options just steps away.<\u002Fp>\n    <p>This guide is designed to help you settle in quickly. It's your go-to for day-to-day life — from how to use the laundry app to where to find the composting bin. While this guide covers the how-tos, please also take a moment to review the formal <a href=\"https://drive.google.com/file/d/1td0nfVtyZ3W3bd7VdH4TZCd_eqtDhmwf/view?usp=share_link\" target=\"_blank\">House Rules<\u002Fa> (available as a PDF on BuildingLink) for the legal and safety policies that keep our building running smoothly for everyone.<\u002Fp>\n    <p>Our Board is made up of your neighbors — volunteers dedicated to keeping the building safe, clean, and a great place to live. We welcome your questions and thoughts!<\u002Fp>\n    <p style=\"font-family: 'Jost', sans-serif; margin-top: 24px;\">Warmly,<br>The 433 West 34th Street Co-op Board<\u002Fp>\n  <\u002Fsection>\n\n  <!-- SECTION 1: WHO TO CONTACT -->\n  <section id=\"s1\" style=\"break-before: page;\">\n    <div style=\"font-family: 'Jost', sans-serif; letter-spacing: 0.3em; text-transform: uppercase; font-size: 12px; color: var(--bronze-dark); margin-top: 34px; margin-bottom: 6px;\">Section 01<\u002Fdiv>\n    <h2 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 30px; margin: 0 0 8px; border-bottom: 3px double var(--bronze); padding-bottom: 14px;\">Who to Contact<\u002Fh2>\n\n    <h3 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px;\">Orsid New York (Building Management)<\u002Fh3>\n    <p>Reach out to Connor McGrath (Account Executive) at cmcgrath@orsidny.com, or use the \"Contact Management\" shortcut on BuildingLink as your starting point.<\u002Fp>\n    <sc-raw-table style=\"margin-top: 12px;\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"padding-right: 32px;\">Name &amp; Role<\u002Fsc-raw-th><sc-raw-th style=\"padding-right: 24px;\">Phone<\u002Fsc-raw-th><sc-raw-th>Email<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td style=\"padding-right: 32px;\">Connor McGrath, Account Executive<\u002Fsc-raw-td><sc-raw-td style=\"padding-right: 24px;\">212-484-3746<\u002Fsc-raw-td><sc-raw-td>cmcgrath@orsidny.com<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding-right: 32px;\">John Devall, Vice President<\u002Fsc-raw-td><sc-raw-td style=\"padding-right: 24px;\">212-484-3760<\u002Fsc-raw-td><sc-raw-td>jdevall@orsidny.com<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding-right: 32px;\">Molly Minter, Admin Assistant<\u002Fsc-raw-td><sc-raw-td style=\"padding-right: 24px;\">347-973-0454<\u002Fsc-raw-td><sc-raw-td>mminter@orsidny.com<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding-right: 32px;\">Jaimi Devall, Transfer Agent<\u002Fsc-raw-td><sc-raw-td style=\"padding-right: 24px;\">212-484-3766<\u002Fsc-raw-td><sc-raw-td>jaimid@orsidny.com<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n\n    <h3 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px;\">Co-op Board Members (2026–2027)<\u002Fh3>\n    <p>You can reach the Co-op Board at <a href=\"mailto:board@433w34.com\">board@433w34.com<\u002Fa>, or use the \"Contact the Board\" shortcut on BuildingLink for suggestions or community concerns.<\u002Fp>\n    <sc-raw-table style=\"margin-top: 12px;\">\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td style=\"padding-right: 32px;\">Jeremy Kuhn<\u002Fsc-raw-td><sc-raw-td>President<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding-right: 32px;\">Lawrence Laier<\u002Fsc-raw-td><sc-raw-td>Vice President<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding-right: 32px;\">Vick Soni<\u002Fsc-raw-td><sc-raw-td>Treasurer<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding-right: 32px;\">Barbara Eastman<\u002Fsc-raw-td><sc-raw-td>Director<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding-right: 32px;\">Beth Morrison<\u002Fsc-raw-td><sc-raw-td>Director<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding-right: 32px;\">Jawad Muaddi<\u002Fsc-raw-td><sc-raw-td>Director<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding-right: 32px;\">Joshua Betz<\u002Fsc-raw-td><sc-raw-td>Director<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n\n    <h3 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px;\">Our Staff<\u002Fh3>\n    <p>Front Desk Phone Number: <strong>+1 (212) 564-4157<\u002Fstrong><\u002Fp>\n    <p style=\"margin-bottom: 6px;\"><strong>Eddie Rodriguez, Superintendent<\u002Fstrong> — oversees both the maintenance team and the doormen.<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 32px; margin-top: 12px;\">\n      <div>\n        <div style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--bronze-dark); margin-bottom: 6px;\">Maintenance Team<\u002Fdiv>\n        <sc-raw-table>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"padding-right: 32px;\">Richard Small<\u002Fsc-raw-td><sc-raw-td>Handyman<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding-right: 32px;\">Marco Pucha<\u002Fsc-raw-td><sc-raw-td>Porter<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding-right: 32px;\">Fernando Fuentes<\u002Fsc-raw-td><sc-raw-td>Porter<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--bronze-dark); margin-bottom: 6px;\">Doormen<\u002Fdiv>\n        <sc-raw-table>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"padding-right: 32px;\">Alex Cordero<\u002Fsc-raw-td><sc-raw-td>Doorman<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding-right: 32px;\">Frankie Curry<\u002Fsc-raw-td><sc-raw-td>Doorman<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding-right: 32px;\">Fredy Fernandez<\u002Fsc-raw-td><sc-raw-td>Doorman<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding-right: 32px;\">Jason Vazquez<\u002Fsc-raw-td><sc-raw-td>Doorman<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px;\">Nearby Essentials<\u002Fh3>\n    <p><strong>Nearest Emergency Room:<\u002Fstrong> Mount Sinai West (428 W 59th St) or Lenox Health Greenwich Village (30 7th Ave).<br><strong>Subways:<\u002Fstrong> A, C, E, 1, 2, 3, and 7 lines are all within a few blocks.<\u002Fp>\n\n  <\u002Fsection>\n\n  <!-- SECTION 2: MOVING IN / OUT -->\n  <section id=\"s2\" style=\"break-before: page;\">\n    <div style=\"font-family: 'Jost', sans-serif; letter-spacing: 0.3em; text-transform: uppercase; font-size: 12px; color: var(--bronze-dark); margin-top: 34px; margin-bottom: 6px;\">Section 02<\u002Fdiv>\n    <h2 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 30px; margin: 0 0 8px; border-bottom: 3px double var(--bronze); padding-bottom: 14px;\">Moving In / Out<\u002Fh2>\n    <p style=\"margin-top: 22px;\">Moving in or out requires coordination with both building management and staff to ensure you have elevator access and that your movers are properly insured.<\u002Fp>\n\n    <div style=\"border-top: 3px double var(--bronze); border-bottom: 3px double var(--bronze); background: var(--bronze-tint); padding: 18px 22px; margin: 20px 0;\">\n      <strong style=\"font-family: 'Jost', sans-serif; font-size: 15px; display: block; margin-bottom: 10px;\">Your Move-Day Checklist<\u002Fstrong>\n      <ol style=\"margin: 0; padding-left: 20px;\">\n        <li style=\"margin-bottom: 8px;\"><strong>Schedule your date:<\u002Fstrong> Contact Orsid Management and the Superintendent as early as possible, preferably at least a week in advance.<\u002Fli>\n        <li style=\"margin-bottom: 8px;\"><strong>Check the clock:<\u002Fstrong> Moves are permitted Monday through Saturday, 9:00 am–5:00 pm. No moves on Sundays or legal holidays.<\u002Fli>\n        <li style=\"margin-bottom: 8px;\"><strong>Submit your COI:<\u002Fstrong> Your moving company must provide a Certificate of Insurance meeting building requirements, sent to Orsid Management for approval before your move date.<\u002Fli>\n        <li style=\"margin-bottom: 8px;\"><strong>Use the right entrance:<\u002Fstrong> All moves go through the service entrance and freight elevator. The lobby and front doors are for residential use only.<\u002Fli>\n        <li style=\"margin-bottom: 8px;\"><strong>Safety first:<\u002Fstrong> The service entrance must never be propped open or left unattended during your move.<\u002Fli>\n        <li><strong>Say hello:<\u002Fstrong> Once you're settled, stop by the front desk to introduce yourself to the doormen and the Super — and have your BuildingLink photo taken for our secure resident directory.<\u002Fli>\n      <\u002Fol>\n    <\u002Fdiv>\n\n    <p>For a full list of moving policies and technical COI requirements, please refer to the Moving In &amp; Out section of the formal <a href=\"https://drive.google.com/file/d/1td0nfVtyZ3W3bd7VdH4TZCd_eqtDhmwf/view?usp=share_link\" target=\"_blank\">House Rules<\u002Fa> (available on BuildingLink).<\u002Fp>\n    <p><strong>Reminder of \"as-is\" ownership &amp; liability:<\u002Fstrong> When you purchase a co-op apartment, you accept it in \"as-is\" condition. You're responsible for any necessary work or repairs inside the apartment, including issues caused by prior renovations from previous owners (such as inherited plumbing or wiring issues that may damage neighboring units).<\u002Fp>\n    <p><em>Pro tip:<\u002Fem> Because you're responsible for damage originating within your four walls, our <a href=\"https://drive.google.com/file/d/1td0nfVtyZ3W3bd7VdH4TZCd_eqtDhmwf/view?usp=share_link\" target=\"_blank\">House Rules<\u002Fa> require maintaining a Homeowners Insurance policy that includes Personal Liability coverage.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- SECTION 3: UTILITIES -->\n  <section id=\"s3\" style=\"break-before: page;\">\n    <div style=\"font-family: 'Jost', sans-serif; letter-spacing: 0.3em; text-transform: uppercase; font-size: 12px; color: var(--bronze-dark); margin-top: 34px; margin-bottom: 6px;\">Section 03<\u002Fdiv>\n    <h2 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 30px; margin: 0 0 8px; border-bottom: 3px double var(--bronze); padding-bottom: 14px;\">Utilities<\u002Fh2>\n\n    <h3 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px;\">Setting Up Your Home<\u002Fh3>\n    <ul style=\"padding-left: 20px;\">\n      <li><strong>Electricity:<\u002Fstrong> Provided by ConEd. You must establish an account in your name upon move-in.<\u002Fli>\n      <li><strong>Internet &amp; cable:<\u002Fstrong> The building is wired for Verizon FiOS and Spectrum. Accounts are established directly with the provider.<\u002Fli>\n      <li><strong data-om-id=\"c6f3c47f:226\">Gas &amp; water:<\u002Fstrong> Supplied by the Co-op and included in monthly dues.<\u002Fli>\n    <\u002Ful>\n\n    <h3 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px;\">Climate Control<\u002Fh3>\n    <p><strong>Heating:<\u002Fstrong> The building uses a steam system. If your radiators are knocking loudly or leaking, please submit a maintenance request via BuildingLink.<\u002Fp>\n    <p><strong>Air conditioning:<\u002Fstrong> For safety, you may not install or remove window A/C units yourself. All installations must be done by a licensed and insured contractor (while the building does not have official vendors, The Frenchmen &amp; Son serves several apartments and can be reached at 718-599-9161).<\u002Fp>\n    <ul style=\"padding-left: 20px;\">\n      <li><strong>Requirements:<\u002Fstrong> Units must be installed in the bottom window only, supported by an external bracket and secured on the inside via a metal brace.<\u002Fli>\n      <li><strong>Disposal:<\u002Fstrong> Old A/C units may not be left in the basement or with regular trash — coordinate disposal with your vendor or the Super (fees may apply).<\u002Fli>\n      <li><strong>Winterizing:<\u002Fstrong> Insulate and cover window A/C units during the winter months to keep your apartment cozy and save energy.<\u002Fli>\n    <\u002Ful>\n    <p>Detailed policies on A/C bracket requirements and window safety can be found in the Air Conditioners and Windows sections of the <a href=\"https://drive.google.com/file/d/1td0nfVtyZ3W3bd7VdH4TZCd_eqtDhmwf/view?usp=share_link\" target=\"_blank\">House Rules<\u002Fa>.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- SECTION 4: BUILDINGLINK -->\n  <section id=\"s4\" style=\"break-before: page;\">\n    <div style=\"font-family: 'Jost', sans-serif; letter-spacing: 0.3em; text-transform: uppercase; font-size: 12px; color: var(--bronze-dark); margin-top: 34px; margin-bottom: 6px;\">Section 04<\u002Fdiv>\n    <h2 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 30px; margin: 0 0 8px; border-bottom: 3px double var(--bronze); padding-bottom: 14px;\">BuildingLink: Our Primary Communication Tool<\u002Fh2>\n    <p style=\"margin-top: 22px;\">BuildingLink (<a href=\"http://www.433w34.com\">www.433w34.com<\u002Fa>) is the heart of our building's operations. Once you sign your lease or sublease, a profile will be created for you.<\u002Fp>\n\n    <h3 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px;\">Use BuildingLink To:<\u002Fh3>\n    <ul style=\"padding-left: 20px;\">\n      <li><strong>Submit maintenance requests:<\u002Fstrong> the only way to track repairs for building systems (like a leaky radiator).<\u002Fli>\n      <li><strong>Manage deliveries:<\u002Fstrong> you'll receive a notification whenever a package arrives for you.<\u002Fli>\n      <li><strong>Authorize guests:<\u002Fstrong> use the \"Front Desk\" instructions to request visitor or service provider access (like dog walkers or housekeepers).<\u002Fli>\n      <li><strong>Stay informed:<\u002Fstrong> access the building's annual financial reports, renovation forms, and community forums.<\u002Fli>\n      <li><strong>Connect with neighbors:<\u002Fstrong> browse the \"marketplace\" to buy/sell items or find local recommendations.<\u002Fli>\n    <\u002Ful>\n    <p><strong>A note on security:<\u002Fstrong> to help our doormen keep the building safe, we require a photo of all residents for our private directory. Please stop by the front desk to have your photo taken shortly after you arrive.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- SECTION 5: GARBAGE / RECYCLING -->\n  <section id=\"s5\" style=\"break-before: page;\">\n    <div style=\"font-family: 'Jost', sans-serif; letter-spacing: 0.3em; text-transform: uppercase; font-size: 12px; color: var(--bronze-dark); margin-top: 34px; margin-bottom: 6px;\">Section 05<\u002Fdiv>\n    <h2 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 30px; margin: 0 0 8px; border-bottom: 3px double var(--bronze); padding-bottom: 14px;\">Garbage / Recycling<\u002Fh2>\n    <ul style=\"padding-left: 20px; margin-top: 22px;\">\n      <li><strong>Daily trash:<\u002Fstrong> secure all non-recyclable garbage in sealed plastic bags and use the garbage chutes located in both the West and East stairwells on each floor.<\u002Fli>\n      <li><strong>Recycling:<\u002Fstrong> we recycle paper, cardboard, metal, glass, and rigid plastic — place these in the designated bins in the West stairwell on your floor.<\u002Fli>\n      <li><strong>Composting:<\u002Fstrong> in compliance with NYC law, we have a communal composting bin in the basement next to the large item area. Please use biodegradable bags for all food scraps.<\u002Fli>\n      <li><strong>Large items &amp; mattresses:<\u002Fstrong> for furniture or large electronics, coordinate with the Superintendent for disposal in the basement. Mattresses must be wrapped in plastic before being brought downstairs.<\u002Fli>\n    <\u002Ful>\n    <p><em>Pro tip:<\u002Fem> never leave garbage or recycling on the floor of the stairwells or hallways — it attracts pests and fines.<\u002Fp>\n\n    <div style=\"border-top: 3px double var(--bronze); border-bottom: 3px double var(--bronze); background: var(--bronze-tint); padding: 18px 22px; margin: 24px 0;\">\n      <strong style=\"font-family: 'Jost', sans-serif; font-size: 15px; display: block; margin-bottom: 8px;\">Never Down the Chute: Needles &amp; Broken Glass<\u002Fstrong>\n      <p style=\"margin: 0;\">The chute feeds directly into the compactor, and needles or broken glass put our maintenance staff at real risk of injury. <strong data-om-id=\"26dca1e4:277\">Needles must be placed in a sharps container and brought down to the basement trash bin<\u002Fstrong> — never dropped down the chute. <strong data-om-id=\"26dca1e4:278\">Broken glass<\u002Fstrong> should also be carried down to the basement recycling bins rather than put down the chute.<\u002Fp>\n    <\u002Fdiv>\n\n    <p>For a full list of items that cannot be put down the chute and details on fines for repeat offenses, please see the Garbage Disposal section of the <a href=\"https://drive.google.com/file/d/1td0nfVtyZ3W3bd7VdH4TZCd_eqtDhmwf/view?usp=share_link\" target=\"_blank\">House Rules<\u002Fa>.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- SECTION 6: LAUNDRY -->\n  <section id=\"s6\" style=\"break-before: page;\">\n    <div style=\"font-family: 'Jost', sans-serif; letter-spacing: 0.3em; text-transform: uppercase; font-size: 12px; color: var(--bronze-dark); margin-top: 34px; margin-bottom: 6px;\">Section 06<\u002Fdiv>\n    <h2 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 30px; margin: 0 0 8px; border-bottom: 3px double var(--bronze); padding-bottom: 14px;\">Laundry<\u002Fh2>\n    <p style=\"margin-top: 22px;\">Our laundry room is located in the basement and is open 24/7.<\u002Fp>\n    <ul style=\"padding-left: 20px;\">\n      <li><strong>The service provider:<\u002Fstrong> laundry services are managed by an outside vendor, Sebco. Because the building doesn't own or service the machines, refunds and repairs must be handled directly through Sebco.<\u002Fli>\n      <li><strong>How to pay:<\u002Fstrong> the machines are coinless and operated via the MyMagicPass app (iOS and Android). Set up your account by downloading the app and looking for the building's address.<\u002Fli>\n      <li><strong>Keyfobs:<\u002Fstrong> if you prefer not to use a smartphone, request a keyfob from the Super for the laundry room's touch-screen system.<\u002Fli>\n      <li><strong>Live updates:<\u002Fstrong> check the app before heading down to see which machines are currently available.<\u002Fli>\n      <li><strong>Maintenance:<\u002Fstrong> if a machine malfunctions, report it directly through the MyMagicPass app for a refund and repair.<\u002Fli>\n      <li><strong>Courtesy:<\u002Fstrong> please remove your laundry promptly so others can use the machines, and don't take the rolling metal carts out of the laundry room.<\u002Fli>\n    <\u002Ful>\n  <\u002Fsection>\n\n  <!-- SECTION 7: MAINTENANCE AND REPAIRS -->\n  <section id=\"s7\" style=\"break-before: page;\">\n    <div style=\"font-family: 'Jost', sans-serif; letter-spacing: 0.3em; text-transform: uppercase; font-size: 12px; color: var(--bronze-dark); margin-top: 34px; margin-bottom: 6px;\">Section 07<\u002Fdiv>\n    <h2 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 30px; margin: 0 0 8px; border-bottom: 3px double var(--bronze); padding-bottom: 14px;\">Maintenance and Repairs<\u002Fh2>\n\n    <h3 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px;\">Building Systems (Building Responsibility)<\u002Fh3>\n    <p>The staff's primary job is to maintain the building's \"bones\" and shared systems. Submit a BuildingLink ticket for:<\u002Fp>\n    <ul style=\"padding-left: 20px;\">\n      <li>Issues with heat or radiators.<\u002Fli>\n      <li>Problems with windows or window frames — if a window is sticking, leaking, or not opening/closing easily, the staff can repair it.<\u002Fli>\n      <li>In-wall plumbing leaks or major drain blockages.<\u002Fli>\n      <li>Common area issues (lights out in hallways, elevator issues).<\u002Fli>\n    <\u002Ful>\n\n    <h3 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px;\">Apartment Interiors (Resident Responsibility)<\u002Fh3>\n    <p>Generally, anything inside your four walls is your responsibility to maintain, including:<\u002Fp>\n    <ul style=\"padding-left: 20px;\">\n      <li>Appliances (refrigerators, ranges, dishwashers, A/C units).<\u002Fli>\n      <li>Fixtures (faucets, light bulbs, door handles, blinds).<\u002Fli>\n      <li>Clogged sinks or toilets (unless it's a main-line issue).<\u002Fli>\n    <\u002Ful>\n\n    <div style=\"border-top: 3px double var(--bronze); border-bottom: 3px double var(--bronze); background: var(--bronze-tint); padding: 18px 22px; margin: 24px 0;\">\n      <strong style=\"font-family: 'Jost', sans-serif; font-size: 15px; display: block; margin-bottom: 8px;\">🚨 Emergency Contacts<\u002Fstrong>\n      <p style=\"margin: 0 0 8px;\">For active leaks, gas smells, or other non-medical emergencies, immediately notify the Superintendent and Management.<\u002Fp>\n      <p style=\"margin: 0;\"><strong>During business hours:<\u002Fstrong> call the Super, the front desk, or Orsid Management.<br><strong>After hours:<\u002Fstrong> call the Front Desk/Doorman, who will contact the emergency on-call staff.<\u002Fp>\n    <\u002Fdiv>\n\n    <h3 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px;\">Hiring Staff for Private Repairs<\u002Fh3>\n    <p>If you'd like our staff to assist with private repairs inside your apartment, they must be hired as independent contractors outside their building work hours.<\u002Fp>\n    <ul style=\"padding-left: 20px;\">\n      <li><strong>Contract required:<\u002Fstrong> the Super will provide a standard contract before any work begins.<\u002Fli>\n      <li><strong>Approval:<\u002Fstrong> a signed copy must be submitted to and approved by Orsid Management and the Board before work starts.<\u002Fli>\n      <li><strong>Liability:<\u002Fstrong> staff members are not insured in their personal capacities for private work. Residents assume all liability for issues arising from private repairs.<\u002Fli>\n    <\u002Ful>\n    <p>For more on what constitutes a \"Building System\" vs. a \"Shareholder Responsibility,\" please refer to the <a href=\"https://drive.google.com/file/d/1td0nfVtyZ3W3bd7VdH4TZCd_eqtDhmwf/view?usp=share_link\" target=\"_blank\">House Rules<\u002Fa> and Proprietary Lease.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- SECTION 8: INSURANCE -->\n  <section id=\"s8\" style=\"break-before: page;\">\n    <div style=\"font-family: 'Jost', sans-serif; letter-spacing: 0.3em; text-transform: uppercase; font-size: 12px; color: var(--bronze-dark); margin-top: 34px; margin-bottom: 6px;\">Section 08<\u002Fdiv>\n    <h2 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 30px; margin: 0 0 8px; border-bottom: 3px double var(--bronze); padding-bottom: 14px;\">Insurance Requirements<\u002Fh2>\n    <p style=\"margin-top: 22px;\">Because shareholders are responsible for everything within their four walls, insurance is not just recommended — it is required.<\u002Fp>\n    <p><strong>For shareholders:<\u002Fstrong> you must maintain a Homeowners Insurance (HO6) policy that includes Personal Liability insurance. This covers damages to neighboring apartments (e.g., if your tub overflows), the building, and general liability. Proof of liability insurance must be submitted to our designated vendor annually (currently BuildingGuard). We highly recommend also covering your personal property.<\u002Fp>\n    <p><strong>For subtenants:<\u002Fstrong> all renters must carry Renter's Insurance with a minimum liability coverage of $1M as listed in the House Rules. Proof of insurance must be submitted to our designated vendor annually (currently BuildingGuard).<\u002Fp>\n    <p><strong>Liability:<\u002Fstrong> any damage to other units, common spaces, or the building itself resulting from an incident originating inside your apartment — in a system you must maintain — is your financial responsibility.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- SECTION 9: BUILDING AMENITIES -->\n  <section id=\"s9\" style=\"break-before: page;\">\n    <div style=\"font-family: 'Jost', sans-serif; letter-spacing: 0.3em; text-transform: uppercase; font-size: 12px; color: var(--bronze-dark); margin-top: 34px; margin-bottom: 6px;\">Section 09<\u002Fdiv>\n    <h2 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 30px; margin: 0 0 8px; border-bottom: 3px double var(--bronze); padding-bottom: 14px;\">Building Amenities<\u002Fh2>\n    <p style=\"margin-top: 22px;\">All amenity areas are located in the basement. For the safety of the building, please ensure all doors are closed and locked behind you when entering or exiting.<\u002Fp>\n    <ul style=\"padding-left: 20px;\">\n      <li><strong>Storage lockers:<\u002Fstrong> a limited number are available in the basement to Shareholders only, for a monthly fee. Currently in high demand, with a waitlist maintained on BuildingLink.<\u002Fli>\n      <li><strong>Bicycle storage:<\u002Fstrong> a dedicated bike room in the basement is available for an annual fee — request a space via BuildingLink.<\u002Fli>\n      <li><strong>Roof deck:<\u002Fstrong> currently closed and not available for resident use.<\u002Fli>\n    <\u002Ful>\n\n    <div style=\"border-top: 3px double var(--bronze); border-bottom: 3px double var(--bronze); background: var(--bronze-tint); padding: 18px 22px; margin: 24px 0;\">\n      <strong style=\"font-family: 'Jost', sans-serif; font-size: 15px; display: block; margin-bottom: 8px;\">Important Safety Rule: Lithium-Ion Battery Ban<\u002Fstrong>\n      <p style=\"margin: 0;\">Per our <a href=\"https://drive.google.com/file/d/1td0nfVtyZ3W3bd7VdH4TZCd_eqtDhmwf/view?usp=share_link\" target=\"_blank\">House Rules<\u002Fa> and NYC Fire Department safety regulations, e-bikes, e-scooters, and individual lithium-ion batteries are strictly prohibited from being stored or charged anywhere in the building — including the bike room, storage lockers, and individual apartments.<\u002Fp>\n    <\u002Fdiv>\n\n    <p>Professional exterminators visit weekly, accompanied by building staff; a sign-up sheet is maintained by the doormen. The extermination cost is covered by monthly maintenance.<\u002Fp>\n    <p>Please note the building has no parking or standing agreements with local garages, and the NYPD rigorously enforces the bus stop/no-parking zone in front of the building.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- SECTION 10: ACCESS, DELIVERIES AND SECURITY -->\n  <section id=\"s10\" style=\"break-before: page;\">\n    <div style=\"font-family: 'Jost', sans-serif; letter-spacing: 0.3em; text-transform: uppercase; font-size: 12px; color: var(--bronze-dark); margin-top: 34px; margin-bottom: 6px;\">Section 10<\u002Fdiv>\n    <h2 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 30px; margin: 0 0 8px; border-bottom: 3px double var(--bronze); padding-bottom: 14px;\">Access, Deliveries and Security<\u002Fh2>\n\n    <h3 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px;\">Building Security &amp; Doorman Authority<\u002Fh3>\n    <p>The inner lobby door must remain closed at all times. Please don't let anyone you don't recognize \"piggyback\" or follow you into the building — kindly direct them to the doorman for check-in.<\u002Fp>\n    <p>Our doormen have the exclusive responsibility and authority to manage building access for your protection. Please treat staff with courtesy and respect at all times.<\u002Fp>\n    <p>To help our staff maintain a secure environment, we require your photo for the private BuildingLink directory so doormen can quickly recognize you as a resident. You cannot upload this yourself — please stop by the front desk on move-in.<\u002Fp>\n\n    <h3 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px;\">Visitor &amp; Delivery Policy<\u002Fh3>\n    <p>No guest, delivery person, or contractor will be allowed access to your apartment without your permission.<\u002Fp>\n    <ul style=\"padding-left: 20px;\">\n      <li><strong>If you're home:<\u002Fstrong> the doorman will call you for verbal approval. If you can't be reached, the visitor will not be permitted to enter.<\u002Fli>\n      <li><strong>If you're away:<\u002Fstrong> guests or service providers are only granted access if you've pre-authorized them using the \"Front Desk\" instructions on the BuildingLink app.<\u002Fli>\n      <li><strong>Packages:<\u002Fstrong> you'll receive an automated BuildingLink alert when a delivery is dropped at the desk. Please pick up items promptly to keep the package room clear and organized.<\u002Fli>\n    <\u002Ful>\n\n    <h3 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px;\">Key Management &amp; Emergency Access<\u002Fh3>\n    <ul style=\"padding-left: 20px;\">\n      <li><strong>KeyLink system:<\u002Fstrong> used for courtesy visitor key storage — doormen aren't permitted to hold loose keys at the desk. All guest or service-provider keys must be registered through this system.<\u002Fli>\n      <li><strong>Emergency key access:<\u002Fstrong> per the Proprietary Lease, the building must have a copy of your apartment key on file for emergencies (e.g., an active leak while you're away).<\u002Fli>\n      <li><strong>New locks:<\u002Fstrong> locks are owned by the building, not by shareholders. To change your locks, contact Management and the Super.<\u002Fli>\n      <li><strong>Key audits:<\u002Fstrong> the building conducts periodic key audits. If a key is missing, you must provide one — otherwise the building may hire a locksmith at the shareholder's expense to ensure access.<\u002Fli>\n    <\u002Ful>\n  <\u002Fsection>\n\n  <!-- SECTION 11: COMMUNITY LIFE -->\n  <section id=\"s11\" style=\"break-before: page;\">\n    <div style=\"font-family: 'Jost', sans-serif; letter-spacing: 0.3em; text-transform: uppercase; font-size: 12px; color: var(--bronze-dark); margin-top: 34px; margin-bottom: 6px;\">Section 11<\u002Fdiv>\n    <h2 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 30px; margin: 0 0 8px; border-bottom: 3px double var(--bronze); padding-bottom: 14px;\">Community Life (Pets, Noise &amp; Flooring)<\u002Fh2>\n\n    <div style=\"border-top: 3px double var(--bronze); border-bottom: 3px double var(--bronze); background: var(--bronze-tint); padding: 18px 22px; margin: 22px 0;\">\n      <strong style=\"font-family: 'Jost', sans-serif; font-size: 15px; display: block; margin-bottom: 8px;\">The 80% Rug Rule &amp; Quiet Hours (10:00 PM – 8:00 AM)<\u002Fstrong>\n      <p style=\"margin: 0 0 8px;\">To minimize noise transfer in our pre-war building, the <a href=\"https://drive.google.com/file/d/1td0nfVtyZ3W3bd7VdH4TZCd_eqtDhmwf/view?usp=share_link\" target=\"_blank\">House Rules<\u002Fa> require that 80% of the floor area in each room (excluding kitchens and bathrooms) be covered with rugs or carpeting and effective noise-reducing padding — the most effective way to stay a good neighbor to those living below you.<\u002Fp>\n      <p style=\"margin: 0;\">Please be mindful of noise levels at all times, especially during quiet hours — including loud music, heavy exercise, or loud social gatherings. Even outside quiet hours, noise that is excessive enough to disturb your neighbors is never permitted.<\u002Fp>\n    <\u002Fdiv>\n\n    <p><strong>Being a good neighbor:<\u002Fstrong> pre-war buildings have character, but they can also have shared sounds. Before reaching out to Management about a noise issue, we encourage a friendly conversation with your neighbor first — often, they simply aren't aware the sound is carrying. Please don't ask the doormen to resolve noise complaints; it's outside their union-managed job responsibilities.<\u002Fp>\n\n    <h3 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px;\">Pet Etiquette<\u002Fh3>\n    <p>We are a pet-friendly community! To keep our home clean and safe for all:<\u002Fp>\n    <ul style=\"padding-left: 20px;\">\n      <li>Pets must be leashed or in a carrier at all times in the lobby, elevators, hallways, and basement.<\u002Fli>\n      <li>Pets are not permitted to linger or \"loiter\" in the lobby.<\u002Fli>\n      <li>If an accident occurs in a common area, please notify a staff member immediately so it can be properly sanitized.<\u002Fli>\n    <\u002Ful>\n\n    <h3 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px;\">Hallway &amp; Stairwell Safety<\u002Fh3>\n    <p>Per NYC law, all hallways and stairwells (fire egresses) must remain completely free and clear of debris, shoes, strollers, umbrellas, or other objects at all times — these are your primary escape routes, and obstructing them is a fire hazard that can lead to fines.<\u002Fp>\n\n    <h3 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px;\">Building Exterior &amp; Smoking Policy<\u002Fh3>\n    <p>To maintain our building's historic facade, please don't hang anything (signs, awnings, or antennas) from your windows or leave items on exterior sills. Per NYC law and our building policy, smoking (including e-cigarettes and cannabis) is strictly prohibited in all common areas, including the lobby, hallways, stairwells, and the laundry room.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- SECTION 12: RENOVATIONS -->\n  <section id=\"s12\" style=\"break-before: page;\">\n    <div style=\"font-family: 'Jost', sans-serif; letter-spacing: 0.3em; text-transform: uppercase; font-size: 12px; color: var(--bronze-dark); margin-top: 34px; margin-bottom: 6px;\">Section 12<\u002Fdiv>\n    <h2 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 30px; margin: 0 0 8px; border-bottom: 3px double var(--bronze); padding-bottom: 14px;\">Renovations &amp; Alterations<\u002Fh2>\n    <p style=\"margin-top: 22px;\"><strong>Alteration agreements:<\u002Fstrong> before starting any work beyond simple painting — floor refinishing, electrical upgrades, or plumbing work — you must have an Alteration Agreement. There are two paths:<\u002Fp>\n    <ul style=\"padding-left: 20px;\">\n      <li><strong>Cosmetic:<\u002Fstrong> a simplified application for minor work like painting or changing a faucet.<\u002Fli>\n      <li><strong>Extensive:<\u002Fstrong> a full application for anything involving walls, flooring, or building systems (plumbing, electrical, gas). Larger renovations are reviewed by the building's architect at the shareholder's expense, and this process can take several weeks.<\u002Fli>\n    <\u002Ful>\n    <p><strong>Contractor requirements:<\u002Fstrong> all contractors must be licensed and insured, with a Certificate of Insurance on file with Management naming the building and Orsid as additionally insured.<\u002Fp>\n    <p><strong>The \"riser\" rule:<\u002Fstrong> if you open your kitchen or bathroom walls, you're required to replace the hot and cold water branch lines. The Co-op may also use this opportunity to replace the main building risers at the building's expense — coordinate this with the Superintendent before closing the walls.<\u002Fp>\n    <p>Contractors must use the Service Entrance and Freight Elevator for all materials and debris.<\u002Fp>\n    <p><strong>Permitted hours:<\u002Fstrong> renovation work is strictly limited to Monday through Friday, 9:00 AM–5:00 PM. No work is allowed on weekends or holidays.<\u002Fp>\n    <p><em>Start early<\u002Fem> — the approval process can take several weeks, so submit your paperwork well in advance of your desired start date.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- SECTION 13: SALES -->\n  <section id=\"s13\" style=\"break-before: page;\">\n    <div style=\"font-family: 'Jost', sans-serif; letter-spacing: 0.3em; text-transform: uppercase; font-size: 12px; color: var(--bronze-dark); margin-top: 34px; margin-bottom: 6px;\">Section 13<\u002Fdiv>\n    <h2 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 30px; margin: 0 0 8px; border-bottom: 3px double var(--bronze); padding-bottom: 14px;\">Sales<\u002Fh2>\n    <p style=\"margin-top: 22px;\"><strong>Selling your unit:<\u002Fstrong> if you're planning to sell, your broker's first point of contact should be the Transfer Agent at Orsid. Orsid will provide the necessary exit requirements, disclosure documents, and transfer information.<\u002Fp>\n    <p><strong>Fees &amp; requirements:<\u002Fstrong> subletting and sales involve specific Management fees and legal requirements. Please refer to the <a href=\"https://drive.google.com/file/d/1td0nfVtyZ3W3bd7VdH4TZCd_eqtDhmwf/view?usp=share_link\" target=\"_blank\">House Rules<\u002Fa> (available as a PDF on BuildingLink) for the most up-to-date policies.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- SECTION 14: SUBLETTING -->\n  <section id=\"s14\" style=\"break-before: page;\">\n    <div style=\"font-family: 'Jost', sans-serif; letter-spacing: 0.3em; text-transform: uppercase; font-size: 12px; color: var(--bronze-dark); margin-top: 34px; margin-bottom: 6px;\">Section 14<\u002Fdiv>\n    <h2 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 30px; margin: 0 0 8px; border-bottom: 3px double var(--bronze); padding-bottom: 14px;\">Subletting &amp; Short-Term Rentals (\"Hoteling\")<\u002Fh2>\n\n    <h3 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px;\">Subletting Policy<\u002Fh3>\n    <p>Our building is primarily owner-occupied. To maintain a stable community, the following rules apply:<\u002Fp>\n    <ul style=\"padding-left: 20px;\">\n      <li><strong>The 3-year rule:<\u002Fstrong> shareholders may not sublet during the first three years of ownership.<\u002Fli>\n      <li><strong>Duration:<\u002Fstrong> all sublet agreements must run a minimum of one year and a maximum of two.<\u002Fli>\n      <li><strong>Who is a subtenant?<\u002Fstrong> An apartment is a \"sublet\" if the shareholder of record is not in residence — even if no rent is being paid. Roommates who aren't immediate family also require Board approval.<\u002Fli>\n      <li><strong>Family exception:<\u002Fstrong> occupancy by immediate family may be permitted, but adults still must sign mandatory rules agreements through Management.<\u002Fli>\n    <\u002Ful>\n\n    <h3 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 18px; margin-top: 28px;\">The Approval Process<\u002Fh3>\n    <p>Never allow a guest or subtenant to move in before receiving written Board approval.<\u002Fp>\n    <ul style=\"padding-left: 20px;\">\n      <li><strong>Apply:<\u002Fstrong> access the application via Domecile (contact Orsid if you need help).<\u002Fli>\n      <li><strong>Interview:<\u002Fstrong> prospective subtenants must pass a package review and attend an interview with the Board.<\u002Fli>\n      <li><strong>Fees:<\u002Fstrong> a sublet fee is charged monthly.<\u002Fli>\n      <li><strong>Renewals:<\u002Fstrong> sublets are reviewed annually and renewals are not automatic — the Board may decline a renewal for \"good neighbor\" policy violations.<\u002Fli>\n    <\u002Ful>\n\n    <div style=\"border-top: 3px double var(--bronze); border-bottom: 3px double var(--bronze); background: var(--bronze-tint); padding: 18px 22px; margin: 24px 0;\">\n      <strong style=\"font-family: 'Jost', sans-serif; font-size: 15px; display: block; margin-bottom: 8px;\">Short-Term Rentals (\"Hoteling\") — Strictly Prohibited<\u002Fstrong>\n      <p style=\"margin: 0 0 8px;\">Short-term rentals (less than one year) are strictly prohibited. Unregistered short-term rentals (Airbnb, VRBO, \"apartment swaps\") are illegal in New York City and a violation of our Proprietary Lease.<\u002Fp>\n      <p style=\"margin: 0;\">The Board actively monitors for hoteling. Unauthorized rentals result in immediate $1,000 fines, voided leases, and potential legal action up to termination of the shareholder's lease — whether or not the shareholder is present during the stay.<\u002Fp>\n    <\u002Fdiv>\n\n    <p><strong>Occupancy &amp; roommates:<\u002Fstrong> any occupant residing in an apartment in the shareholder's absence is presumptively considered a subtenant, regardless of whether rent is paid. All non-family residents (even those living alongside a shareholder) require prior Board approval, must commit to a minimum one-year stay, and are subject to the same three-year ownership residency requirement as standard sublets.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- SECTION 15: FINAL WORD -->\n  <section id=\"s15\" style=\"break-before: page;\">\n    <div style=\"font-family: 'Jost', sans-serif; letter-spacing: 0.3em; text-transform: uppercase; font-size: 12px; color: var(--bronze-dark); margin-top: 34px; margin-bottom: 6px;\">Section 15<\u002Fdiv>\n    <h2 style=\"font-family: 'Jost', sans-serif; font-weight: 600; font-size: 30px; margin: 0 0 8px; border-bottom: 3px double var(--bronze); padding-bottom: 14px;\">A Final Word: Compliance &amp; Fines<\u002Fh2>\n    <p style=\"margin-top: 22px;\">433 West 34th Street is a community that relies on the cooperation of all residents. To ensure the safety and quiet enjoyment of the building for everyone, the Board reserves the right to issue fines for violations of the <a href=\"https://drive.google.com/file/d/1td0nfVtyZ3W3bd7VdH4TZCd_eqtDhmwf/view?usp=share_link\" target=\"_blank\">House Rules<\u002Fa>.<\u002Fp>\n    <p><strong>Fines:<\u002Fstrong> the amount of any fine is at the discretion of the Board and will be charged to the shareholder's maintenance account.<\u002Fp>\n    <p><strong>Severe violations:<\u002Fstrong> persistent or severe violations of the <a href=\"https://drive.google.com/file/d/1td0nfVtyZ3W3bd7VdH4TZCd_eqtDhmwf/view?usp=share_link\" target=\"_blank\">House Rules<\u002Fa> or Proprietary Lease can lead to legal action, including termination of the Proprietary Lease.<\u002Fp>\n\n    <div style=\"margin-top: 48px; text-align: center;\">\n      <img src=\"d2662d70-2d49-4d66-bd0b-0d9a3655cf61\" alt=\"\" style=\"width: 56px; height: auto; margin: 0 auto 14px; display: block; filter: grayscale(1) contrast(1.05);\">\n      <div style=\"font-family: 'Jost', sans-serif; letter-spacing: 0.15em; font-size: 13px; color: var(--bronze-dark);\">433 WEST 34TH STREET &nbsp;·&nbsp; CO-OP BOARD<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdoc-page>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;accentColor&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#c0a000&quot;, &quot;options&quot;: [&quot;#c0a000&quot;, &quot;#8a7000&quot;, &quot;#3c6e71&quot;, &quot;#25494b&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Theme&quot;},\n  &quot;includeQuickReference&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Content&quot;}\n}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const accent = this.props.accentColor ?? '#c0a000';\n    return {\n      themeVars: `--bronze:${accent}; --bronze-dark:color-mix(in srgb, ${accent} 65%, black); --bronze-tint:color-mix(in srgb, ${accent} 10%, white); --bronze-line:color-mix(in srgb, ${accent} 40%, white);`,\n      showQuickRef: this.props.includeQuickReference ?? true,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
